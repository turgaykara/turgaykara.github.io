              <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
                  <thead>
                    <tr style="border-bottom:1px solid var(--glass);">
                      <th style="text-align:left;padding:8px;color:#cbd5e1;">&nbsp;</th>
                      <th style="text-align:left;padding:8px;color:var(--accent);">Authentication (Kimlik Doğrulama)</th>
                      <th style="text-align:left;padding:8px;color:var(--secondary);">Authorization (Yetkilendirme)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Tanım</b></td>
                      <td style="padding:8px;">Kullanıcının veya sistemin iddia ettiği kişi olduğunu doğrular.</td>
                      <td style="padding:8px;">Doğrulanmış kullanıcının hangi kaynağa erişebileceğini belirler.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Amaç</b></td>
                      <td style="padding:8px;">"Sen kimsin?" sorusuna yanıt arar.</td>
                      <td style="padding:8px;">"Bu işlemi yapmaya iznin var mı?" sorusuna yanıt arar.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Süreç</b></td>
                      <td style="padding:8px;">Kimlik bilgisi kontrolü (parola, OTP, token).</td>
                      <td style="padding:8px;">Rol ve erişim kontrol listeleri (ACL, RBAC, ABAC).</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Sonuç</b></td>
                      <td style="padding:8px;">Oturum açıldı / reddedildi.</td>
                      <td style="padding:8px;">Erişim verildi (200) / Reddedildi (403 Forbidden).</td>
                    </tr>
                    <tr>
                      <td style="padding:8px;color:#cbd5e1;"><b>Örnek</b></td>
                      <td style="padding:8px;">Kullanıcı adı + şifre + SMS kodu ile login olmak.</td>
                      <td style="padding:8px;">Standart kullanıcının <code>/admin</code> paneline girmeye çalışması.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="small" style="margin-top:10px;color:var(--muted);font-size:12px;"><b>Pentest İpucu:</b> Giriş mekanizması sorunsuz çalışan bir sistemde kullanıcı başkasının verisine erişebiliyorsa (IDOR / BAC), Authentication sağlam ama Authorization kırılmıştır.</div>
            `
          },
          {
            title: '2. Kimlik Doğrulama Mekanizma Türleri',
            content: `
              <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">Password-Based (Parola Tabanlı):</strong>
                  <p style="margin:4px 0 0 0;font-size:13px;">En yaygın ve en çok saldırıya uğrayan yöntemdir. Sözlük (Dictionary), Brute Force ve Credential Stuffing saldırılarına karşı kırılgandır.</p>
                </li>
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">Multi-Factor / Two-Factor Authentication (MFA / 2FA):</strong>
                  <p style="margin:4px 0 8px 0;font-size:13px;">Birden fazla bağımsız güvenlik katmanının birleşimidir:</p>
                  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;font-size:12px;">
                      <b style="color:var(--accent);">1. Bildiğin Şey:</b><br>Parola, PIN, Yanıt
                    </div>
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;font-size:12px;">
                      <b style="color:var(--secondary);">2. Sahip Olduğun Şey:</b><br>Telefon, Donanım Key, OTP App
                    </div>
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;font-size:12px;">
                      <b style="color:#4ade80;">3. Olduğun Şey:</b><br>Parmak İzi, Yüz, Biyometri
                    </div>
                  </div>
                </li>
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">Token-Based & SSO (Single Sign-On):</strong>
                  <p style="margin:4px 0 0 0;font-size:13px;">Başarılı giriş sonrasında istemciye verilen imzalı token'lar (JWT, OAuth) ile sonraki tüm istekler doğrulanır. SSO sayesinde tek bir merkezden yüzlerce uygulamaya oturum açılabilir.</p>
                </li>
              </ul>
            `
          },
          {
            title: '3. Session Management - 4 Temel Fonksiyon',
            content: `
              <ul style="list-style:none;padding:0;margin:0;display:grid;gap:10px">
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">1. Session Creation (Oturum Oluşturma):</strong> Kullanıcı login olduğunda sunucu tarafında cryptographically secure (kriptografik olarak güvenli) yüksek karmaşıklıkta benzersiz bir Session ID üretilir ve client'a iletilir.
                </li>
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">2. Session Maintenance (Oturum Sürdürme):</strong> HTTP protokolü <i>stateless</i> (durumsuz) olduğundan, istemci her istekte bu Session ID'yi sunucuya taşır (Cookie veya Header ile) ve kimliğini doğrulatır.
                </li>
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">3. Session Security (Oturum Güvenliği):</strong> Session Hijacking, Session Fixation ve Replay saldırılarına karşı çerez flag'leri (HttpOnly, Secure, SameSite) ve TLS kullanımı zorunludur.
                </li>
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
                  <strong style="color:#cbd5e1;">4. Session Termination (Oturum Sonlandırma):</strong> Belirli bir hareketsizlik (Inactivity Timeout) süresi dolduğunda veya kullanıcı Logout yaptığında hem sunucu hem de istemci tarafında session verisi imha edilmelidir.
                </li>
              </ul>
            `
          },
          {
            title: '4. Cookie Saklama Yöntemleri ve Güvenlik Güvenceleri',
            content: `
              <div style="display:grid;gap:12px;">
                <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px;">
                  <strong style="color:#cbd5e1;">Cookie Nerede ve Nasıl Saklanır?</strong>
                  <p style="margin:4px 0 0 0;font-size:13px;">Çerezler istemci tarafında tarayıcının kendi yönettiği disk alanında (SQLite / şifreli veritabanları) veya doğrudan bellek üzerinde tutulur:</p>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;">
                      <span style="color:var(--accent);font-weight:bold;font-size:12px;">Session Cookie (Bellek):</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">RAM'de saklanır. <code>Expires/Max-Age</code> verilmez. Tarayıcı kapandığında otomatik silinir.</p>
                    </div>
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;">
                      <span style="color:var(--secondary);font-weight:bold;font-size:12px;">Persistent Cookie (Disk):</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">Diske kaydedilir. Tanımlanan son kullanma tarihi dolana kadar tarayıcı kapansa bile saklanır.</p>
                    </div>
                  </div>
                </div>

                <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px;">
                  <strong style="color:#cbd5e1;">Çerez Güvenlik Bayrakları (Cookie Flags):</strong>
                  <div style="display:grid;gap:8px;margin-top:8px;">
                    <div style="background:rgba(34,197,94,0.05);padding:8px;border-radius:6px;border:1px solid rgba(34,197,94,0.2);">
                      <span style="color:#4ade80;font-weight:bold;font-size:12px;">HttpOnly Flag:</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">JavaScript (<code>document.cookie</code>) üzerinden çereze erişimi engeller. XSS saldırılarına karşı kritik kalkan oluşturur.</p>
                    </div>
                    <div style="background:rgba(34,197,94,0.05);padding:8px;border-radius:6px;border:1px solid rgba(34,197,94,0.2);">
                      <span style="color:#4ade80;font-weight:bold;font-size:12px;">Secure Flag:</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">Çerezin sadece HTTPS (TLS/SSL) şifreli hat üzerinden iletilmesini sağlar. MitM dinlemelerini önler.</p>
                    </div>
                    <div style="background:rgba(34,197,94,0.05);padding:8px;border-radius:6px;border:1px solid rgba(34,197,94,0.2);">
                      <span style="color:#4ade80;font-weight:bold;font-size:12px;">SameSite (Strict / Lax / None):</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">Çerezin siteler arası isteklerde (Cross-Site Request) gönderilme kurallarını belirleyerek CSRF saldırılarını engeller.</p>
                    </div>
                  </div>
                </div>
              </div>
            `
          },
          {
            title: '5. Tarayıcı Çerez Hedeflemesi (Cookie Scoping vs SOP)',
            content: `
              <p style="color:var(--muted);font-size:14px;margin-bottom:12px;">
                Tarayıcının bir çerezi hangi isteklerde göndereceğini belirleyen kurallar, standart <b>Same-Origin Policy (SOP)</b> kurallarından farklıdır ve daha esnektir:
              </p>
              <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
                  <thead>
                    <tr style="border-bottom:1px solid var(--glass);">
                      <th style="text-align:left;padding:8px;color:#cbd5e1;">Kriter</th>
                      <th style="text-align:left;padding:8px;color:var(--accent);">Same-Origin Policy (SOP)</th>
                      <th style="text-align:left;padding:8px;color:var(--secondary);">Cookie Scoping Mantığı</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Domain / Subdomain</b></td>
                      <td style="padding:8px;">Birebir eşleşme arar (Strict).</td>
                      <td style="padding:8px;"><code>Domain=.example.com</code> parametresi ile tüm subdomain'lere yayılabilir.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Port Ayrımı</b></td>
                      <td style="padding:8px;color:#f43f5e;"><b>Kesinlikle Bakar</b> (80 ve 8080 ayrı origin'dir).</td>
                      <td style="padding:8px;color:#4ade80;"><b>Bakmaz!</b> Bütün portlar aynı çerez alanına erişebilir ve yazabilir.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Protokol (HTTP/HTTPS)</b></td>
                      <td style="padding:8px;">Birebir eşleşme arar.</td>
                      <td style="padding:8px;">Sadece <code>Secure</code> bayrağı varsa HTTPS şartı arar, yoksa ikisine de gönderir.</td>
                    </tr>
                    <tr>
                      <td style="padding:8px;color:#cbd5e1;"><b>Path (Yol)</b></td>
                      <td style="padding:8px;">Bakmaz (Kapsam Origin seviyesindedir).</td>
                      <td style="padding:8px;"><code>Path=/admin</code> tanımlanarak belirli yollara kısıtlanabilir.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            `
          },
          {
            title: '6. Token Türleri (Bearer / JWT / OAuth)',
            content: `
              <div style="display:grid;gap:10px;">
                <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;">
                  <strong style="color:#cbd5e1;font-size:14px;">Bearer Token:</strong>
                  <p style="margin:4px 0 6px 0;font-size:13px;color:var(--muted);">"Bu token'ı getiren kişi yetkilidir" mantığıyla çalışan basit taşıyıcı anahtarlardır.</p>
                  <pre style="margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);color:var(--accent);font-size:12px;">Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</pre>
                </div>
                
                <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;">
                  <strong style="color:#cbd5e1;font-size:14px;">JSON Web Token (JWT):</strong>
                  <p style="margin:4px 0 0 0;font-size:13px;color:var(--muted);">Header, Payload ve Signature bölümlerinden oluşan, sunucuda session saklama ihtiyacını ortadan kaldıran <i>stateless</i> yapıda imzalı jetonlardır.</p>
                </div>

                <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;">
                  <strong style="color:#cbd5e1;font-size:14px;">OAuth 2.0 Token'ları:</strong>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;">
                      <span style="color:#4ade80;font-weight:bold;font-size:12px;">Access Token:</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">Kısa ömürlüdür. Doğrudan korunan kaynaklara erişim izni verir.</p>
                    </div>
                    <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;">
                      <span style="color:var(--secondary);font-weight:bold;font-size:12px;">Refresh Token:</span>
                      <p style="margin:2px 0 0 0;font-size:12px;color:var(--muted);">Uzun ömürlüdür. Süresi dolan Access Token'ı yenilemek için kullanılır.</p>
                    </div>
                  </div>
                </div>
              </div>
            `
          }
        ]
      },

      network_fundamentals: {
        menuName: 'Ağ Temelleri',
        icon: 'icon-globe',
        parent: 'baslangic-group',
        title: 'Ağ Temelleri',
        description: 'IP adresleme, MAC/ARP, subnet/CIDR, NAT/Gateway, TCP vs UDP, port numaraları, ICMP, DHCP, Proxy/VPN/Firewall ve VLAN. Recon ve internal network testlerinin temeli.',
        sections: [
          {
            title: '1. IP Adresi Nedir?',
            content: `
          <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">IP Adresi:</strong> Bir ağdaki her cihaza atanan, o cihazı benzersiz şekilde tanımlayan sayısal etiket. Postadaki adres gibi düşün - paketlerin (verinin) doğru cihaza ulaşmasını sağlar.
            </li>
          </ul>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
            <div style="background:rgba(99,102,241,0.05);padding:10px;border-radius:6px;border:1px solid rgba(99,102,241,0.2);">
              <span style="color:var(--accent);font-weight:bold;font-size:13px;">IPv4</span>
              <p style="margin:6px 0 0 0;font-size:13px;color:var(--muted);">4 grup, her biri 0-255 arası, nokta ile ayrılmış 32-bit adres.</p>
              <pre style="margin:8px 0 0 0;font-size:12px;color:var(--muted);white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;">192.168.1.10
  ↑    ↑  ↑  ↑
 8bit 8bit 8bit 8bit  → toplam 32 bit = 2^32 ≈ 4.3 milyar adres</pre>
            </div>
            <div style="background:rgba(168,85,247,0.05);padding:10px;border-radius:6px;border:1px solid rgba(168,85,247,0.2);">
              <span style="color:var(--secondary);font-weight:bold;font-size:13px;">IPv6</span>
              <p style="margin:6px 0 0 0;font-size:13px;color:var(--muted);">IPv4 adresleri tükendiği için geliştirildi. 128-bit, 8 grup halinde hexadecimal yazılır.</p>
              <pre style="margin:8px 0 0 0;font-size:12px;color:var(--muted);white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;">2001:0db8:85a3:0000:0000:8a2e:0370:7334</pre>
            </div>
          </div>
          <div style="background:rgba(239,68,68,0.05);padding:10px;border-radius:6px;border:1px solid rgba(239,68,68,0.2);margin-top:12px;">
            <span style="color:#f43f5e;font-weight:bold;font-size:12px;">⚠ Pentest İlişkisi:</span>
            <p style="margin:4px 0 0 0;font-size:13px;color:var(--muted);">Bazı firewall/WAF kuralları sadece IPv4 için yazılır, IPv6 üzerinden bypass mümkün olabilir - pentest'te IPv6 unutulmamalı.</p>
          </div>
        `
          },
          {
            title: '2. IP Adres Türleri ve Aralıkları (Tam Liste)',
            content: `
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
              <thead>
                <tr style="border-bottom:1px solid var(--glass);">
                  <th style="text-align:left;padding:8px;color:#cbd5e1;">Tür</th>
                  <th style="text-align:left;padding:8px;color:var(--accent);">Aralık</th>
                  <th style="text-align:left;padding:8px;color:var(--secondary);">Açıklama</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>Loopback (Local)</b></td>
                  <td style="padding:8px;"><code>127.0.0.0 - 127.255.255.255</code> (/8)</td>
                  <td style="padding:8px;">Cihazın kendi kendine referans verdiği adres. <code>127.0.0.1</code> = "localhost" - hiçbir zaman ağa çıkmaz.</td>
                </tr>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>Private (Class A)</b></td>
                  <td style="padding:8px;"><code>10.0.0.0 - 10.255.255.255</code> (/8)</td>
                  <td style="padding:8px;">Büyük kurumsal ağlarda kullanılan özel aralık.</td>
                </tr>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>Private (Class B)</b></td>
                  <td style="padding:8px;"><code>172.16.0.0 - 172.31.255.255</code> (/12)</td>
                  <td style="padding:8px;">Orta ölçekli ağlar (Docker, kurumsal VPN'lerde sık görülür).</td>

tracert target.com      # Windows</pre>
            </li>
          </ul>
          <div style="background:rgba(239,68,68,0.05);padding:10px;border-radius:6px;border:1px solid rgba(239,68,68,0.2);margin-top:10px;">
            <span style="color:#f43f5e;font-weight:bold;font-size:12px;">⚠ Pentest İlişkisi:</span>
            <p style="margin:4px 0 0 0;font-size:13px;color:var(--muted);">Birçok firewall ICMP'yi tamamen engeller (ping cevap vermez) - bu durumda hostun ayakta olup olmadığını anlamak için <code>nmap -Pn</code> (ping atlayıp doğrudan port tarama) kullanılır. Traceroute, hedefin önünde ne tür bir güvenlik cihazı (load balancer, WAF, firewall) olduğunu tahmin etmeye de yardımcı olabilir.</p>

            title: '10. DHCP Nedir? (DORA Süreci)',
            content: `
          <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">DHCP (Dynamic Host Configuration Protocol):</strong> Ağa bağlanan cihazlara otomatik olarak IP adresi, subnet mask, gateway ve DNS bilgisi atayan protokol. Manuel IP ayarlamaya gerek bırakmaz.

          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;">

            </div>
            <div style="background:rgba(99,102,241,0.05);padding:10px;border-radius:6px;border:1px solid rgba(99,102,241,0.2);">

              <p style="margin:4px 0 0 0;font-size:12px;color:var(--muted);">Sunucu onaylar, IP artık cihaza atanmıştır (kiralama/lease süresiyle birlikte).</p>

          {
            title: '11. Proxy vs VPN vs Firewall',
            content: `
          <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">Proxy:</strong> İstemci ile hedef sunucu arasında aracı görevi görür. İstek proxy üzerinden geçer, hedef sunucu gerçek istemciyi değil proxy'yi görür. Genelde tek uygulama/protokol seviyesinde çalışır (örn: sadece HTTP trafiği).
            </li>
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">VPN (Virtual Private Network):</strong> İstemci ile uzak ağ arasında şifreli bir tünel kurar - tüm işletim sistemi trafiği bu tünelden geçer (sadece tek uygulama değil). Hem gizlilik hem de uzak bir özel ağa (örn: şirket içi ağ) dahil olma amacıyla kullanılır.
            </li>
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">Firewall:</strong> Önceden tanımlı kurallara göre gelen/giden ağ trafiğini filtreleyen sistem (IP, port, protokol bazlı izin/engelleme). Ağ seviyesinde (network firewall) veya uygulama seviyesinde (WAF - Web Application Firewall) çalışabilir.
            </li>
          </ul>
          <div style="background:rgba(239,68,68,0.05);padding:10px;border-radius:6px;border:1px solid rgba(239,68,68,0.2);margin-top:10px;">
            <span style="color:#f43f5e;font-weight:bold;font-size:12px;">⚠ Pentest İlişkisi:</span>
            <p style="margin:4px 0 0 0;font-size:13px;color:var(--muted);">Burp Suite gibi araçlar aslında birer "yerel proxy"dir - tarayıcı ile sunucu arasına girip trafiği yakalar/değiştirir. VPN kullanan hedeflerde internal network testleri VPN tüneli üzerinden yapılır. Firewall/WAF kuralları, recon sırasında IP/port/paket bazlı bypass teknikleriyle (fragmentation, header manipülasyonu, source port değişimi) atlatılmaya çalışılır.</p>
          </div>
        `

          <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">VLAN (Virtual Local Area Network):</strong> Fiziksel olarak aynı switch'e bağlı cihazları, mantıksal olarak ayrı ağlara böler. Örn: aynı switch üzerinde "Finans" ve "Misafir Wi-Fi" cihazları birbirini göremez, ayrı VLAN ID'lerine (örn: VLAN 10, VLAN 20) atanmıştır.
            </li>
            <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
              <strong style="color:#cbd5e1;">Amaç:</strong> Güvenlik segmentasyonu (kritik sistemleri izole etmek) ve trafik yönetimi (broadcast domain'i küçültüp performansı artırmak).
            </li>
          </ul>
          <div style="background:rgba(239,68,68,0.05);padding:10px;border-radius:6px;border:1px solid rgba(239,68,68,0.2);margin-top:10px;">
            <span style="color:#f43f5e;font-weight:bold;font-size:12px;">⚠ Pentest İlişkisi - VLAN Hopping:</span>
            <p style="margin:4px 0 0 0;font-size:13px;color:var(--muted);">Yanlış yapılandırılmış switch portlarında, saldırgan kendi paketlerine sahte VLAN tag'i (802.1Q) ekleyerek normalde erişemeyeceği bir VLAN'a (örn: misafir ağından finans ağına) geçebilir. Internal/red team testlerinde segmentasyonun gerçekten çalışıp çalışmadığını doğrulamak kritik bir adımdır.</p>
          </div>
        `
          }

EXPIRE session:abc123 3600      -- Yaşam süresi (TTL) belirleme (saniye)

db.users.find({ username: { "$gt": "" }, password: { "$gt": "" } }); // Her zaman true döner!</pre>
        </div>
                <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px;margin-top:12px;">
          <strong style="color:#cbd5e1;">Pratik Sömürü: URL/Form Parametresi Üzerinden Operatör Enjeksiyonu</strong>
          <p style="margin:6px 0 8px 0;font-size:13px;color:var(--muted);">Bazı uygulamalar GET/POST parametrelerini doğrudan sorgu nesnesine (query object) çevirir (örn: Express + body-parser).<br>Bu durumda parametre adının içine operatör yazmak, string yerine bir MongoDB operatör nesnesi enjekte etmeyi sağlar:</p>
          <pre style="margin:0 0 8px 0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);font-size:12px;color:var(--muted);">GET /?name=test              -- Normal istek: { name: "test" } döner (tek kullanıcı)
GET /?name[$ne]=test         -- { name: { "$ne": "test" } } -> "test" olmayan HERKES döner
GET /?name[$ne]=a            -- { name: { "$ne": "a" } } -> "a" olmayan HERKES döner (auth bypass)</pre>
          <p style="margin:6px 0 0 0;font-size:13px;color:var(--muted);">Mantık: <code>$ne</code> (not equal) operatörü koşulu neredeyse her zaman doğru kılar,<br>çünkü veritabanındaki hiçbir kayıt (rastgele seçilen) verilen değere tam olarak eşit değildir. Sonuç: filtre boşa düşer, sorgu koleksiyondaki<br>ilk/tüm kayıtları döndürür ve uygulama genelde ilk eşleşen kullanıcı ile oturum açar.</p>
        </div>

        <div style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px;margin-top:12px;">
          <strong style="color:#cbd5e1;">Burp Suite ile Otomatik Auth Bypass Denemesi (Intruder / Sniper Attack)</strong>
          <p style="margin:6px 0 8px 0;font-size:13px;color:var(--muted);">Login isteği hangi NoSQL operatörüne duyarlı olduğu baştan bilinmediğinden, birden çok payload'ı otomatik denemek gerekir.<br>Kullanılan payload listesi hedef veritabanına göre değişir (MongoDB, CouchDB, vb. operatör sözdizimleri farklıdır).</p>
          <div style="overflow-x:auto;margin-bottom:8px;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
              <thead>
                <tr style="border-bottom:1px solid var(--glass);">
                  <th style="text-align:left;padding:8px;color:#cbd5e1;">Adım</th>
                  <th style="text-align:left;padding:8px;color:var(--accent);">İşlem</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>1. Yakalama</b></td>
                  <td style="padding:8px;">Login isteği Burp Proxy ile yakalanır ve Intruder'a gönderilir (Send to Intruder).<br><code>GET /?name=alexis&amp;password=$test$ HTTP/2</code></td>
                </tr>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>2. Attack Type</b></td>
                  <td style="padding:8px;">Tek bir parametre (password değeri) test edileceği için <b>Sniper</b> attack modu seçilir.</td>
                </tr>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>3. Payload Pozisyonu</b></td>
                  <td style="padding:8px;"><code>password</code> parametresinin değeri (<code>$test$</code>) payload pozisyonu (§...§) olarak işaretlenir.</td>
                </tr>
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <td style="padding:8px;color:#cbd5e1;"><b>4. Payload Listesi</b></td>
                  <td style="padding:8px;">SecLists'in NoSQL Injection payload seti yüklenir:<br><code>seclists/Fuzzing/Databases/NoSQL.txt</code><br>Bu liste <code>[$ne]</code>, <code>[$gt]</code>, <code>[$regex]</code>, <code>true, $where: '1==1'</code> gibi hem parametre-adı hem de değer bazlı varyasyonları içerir.</td>
                </tr>
                <tr>
                  <td style="padding:8px;color:#cbd5e1;"><b>5. Analiz</b></td>
                  <td style="padding:8px;">Attack çalıştırılır; sonuç tablosunda <b>Length</b> (yanıt uzunluğu) sütununa göre sıralama yapılır.<br>Başarısız denemeler genelde aynı (sabit) uzunlukta hata sayfası döndürürken, başarılı bypass farklı<br>uzunlukta (örn: dashboard/profil sayfası) bir yanıt üretir - bu fark bypass'ı sağlayan payload'ı işaret eder.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div style="background:rgba(239,68,68,0.05);padding:10px;border-radius:6px;border:1px solid rgba(239,68,68,0.2);margin-top:10px;">
          <span style="color:#f43f5e;font-weight:bold;font-size:12px;">⚠ Neden "Response Length" Güvenilir Bir Göstergedir:</span>
          <p style="margin:4px 0 0 0;font-size:13px;color:var(--muted);">Boolean-based Blind SQLi'deki mantığın aynısı burada da geçerlidir: uygulama sorgu sonucuna göre farklı<br>HTML/JSON döndürüyorsa (başarılı login sayfası vs hata mesajı), yanıt boyutundaki fark koşulun true/false<br>olduğunu dolaylı yoldan ortaya koyar. Ayrıca HTTP status code (200 vs 302/401) ve response time de aynı<br>analizde ikincil doğrulama sinyali olarak kullanılabilir.</p>
        </div>
      `
    },
    {
      title: '8. SQL Enumeration: information_schema ile Keşif',
      content: `
        <p style="margin:0 0 10px 0;font-size:13px;color:var(--muted);">Bir SQLi zafiyeti bulunduğunda ilk adım veritabanı yapısını çıkarmaktır (enumeration). MySQL, PostgreSQL ve MSSQL'de bu işlem meta-veritabanı (information_schema) üzerinden yapılır.</p>
        <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:#cbd5e1;">Klasik Enumeration Sırası:</strong>
            <pre style="margin:8px 0 0 0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);font-size:12px;color:var(--muted);">-- 1. Versiyon ve mevcut DB'yi tespit et
SELECT @@version, database(), current_user();

-- 2. Diğer veritabanlarını listele
SELECT schema_name FROM information_schema.schemata;

-- 3. Hedef DB'deki tabloları listele
SELECT table_name FROM information_schema.tables WHERE table_schema=database();

-- 4. Tablodaki sütunları listele
SELECT column_name FROM information_schema.columns WHERE table_name='users';

-- 5. UNION ile veriyi dışarı çıkar
UNION SELECT username, password FROM users--</pre>
          </li>
        </ul>
        <div style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:13px;margin-top:10px;">
          <strong style="color:#cbd5e1;">Diğer Sistemlerde Karşılıkları:</strong> MSSQL'de <code>sys.tables</code> / <code>sys.columns</code>, PostgreSQL'de <code>pg_catalog</code> benzer işlevi görür.
        </div>
      `
    },
    {
      title: '9. Diğer NoSQL Sistemleri: Elasticsearch & Cassandra',
      content: `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div style="background:rgba(255,255,255,0.02);padding:10px;border-radius:6px;border:1px solid var(--glass);">
            <strong style="color:#cbd5e1;font-size:13px;">Elasticsearch (REST API)</strong>
            <p style="font-size:12px;color:var(--muted);margin:4px 0 8px 0;">Arama motoru altyapısıdır. Kimlik doğrulamasız açık bırakılmış nodelar (varsayılan port: 9200) tüm verilerin çekilmesine izin verir.</p>
            <pre style="margin:0;padding:6px;background:rgba(0,0,0,0.2);border-radius:4px;font-size:11px;color:var(--muted);">GET /_cat/indices?v
GET /users/_search?q=*
GET /users/_mapping</pre>
          </div>
          <div style="background:rgba(255,255,255,0.02);padding:10px;border-radius:6px;border:1px solid var(--glass);">
            <strong style="color:#cbd5e1;font-size:13px;">Cassandra (CQL)</strong>
            <p style="font-size:12px;color:var(--muted);margin:4px 0 8px 0;">Columnar yapıdadır. CQL dili SQL'e sözdizimsel olarak çok benzer ama JOIN işlemlerini desteklemez.</p>
            <pre style="margin:0;padding:6px;background:rgba(0,0,0,0.2);border-radius:4px;font-size:11px;color:var(--muted);">DESCRIBE KEYSPACES;
USE app_keyspace;
SELECT * FROM users;</pre>
          </div>
        </div>
      `
    },
    {
      title: '10. Kimlik Doğrulama ve Yetki Enumeration Komutları',
      content: `
        <p style="margin:0 0 10px 0;font-size:13px;color:var(--muted);">Bir veritabanına erişim sağlandıktan sonra, mevcut kullanıcının yetki seviyesini ve diğer kullanıcı hesaplarını haritalamak kritik önem taşır.</p>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">Veritabanı</th>
                <th style="text-align:left;padding:8px;color:var(--accent);">Kullanıcı Listeleme</th>
                <th style="text-align:left;padding:8px;color:var(--secondary);">Yetki Kontrolü</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                <td style="padding:8px;color:#cbd5e1;"><b>MySQL</b></td>
                <td style="padding:8px;"><code>SELECT user, host FROM mysql.user;</code></td>
                <td style="padding:8px;"><code>SHOW GRANTS FOR CURRENT_USER();</code></td>
              </tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                <td style="padding:8px;color:#cbd5e1;"><b>PostgreSQL</b></td>
                <td style="padding:8px;"><code>SELECT usename FROM pg_user;</code></td>
                <td style="padding:8px;"><code>SELECT current_setting('is_superuser');</code></td>
              </tr>
              <tr>
                <td style="padding:8px;color:#cbd5e1;"><b>MongoDB</b></td>
                <td style="padding:8px;"><code>show users;</code></td>
                <td style="padding:8px;"><code>db.runCommand({ connectionStatus: 1 });</code></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:12px;margin-top:10px;">
          <strong style="color:#cbd5e1;">Raporlama Notu:</strong> Enumeration sırasında bulunan her bilgi (versiyon, kullanıcı listesi, yetki seviyesi) sızma testi raporunda kanıt (PoC) olarak sunulmalıdır.
        </div>
      `
    },
{
      title: '11. Hızlı Referans: Tüm Veritabanı & Sorgu Komutları',
      content: `
        <p style="margin:0 0 10px 0;font-size:13px;color:var(--muted);">Terminal, CLI veya enjeksiyon anında en sık kullanılan temel, mantıksal, kümeleme ve operasyonel komutların tam liste referansı.</p>
        
        <strong style="color:var(--accent);font-size:13px;">1. MongoDB (MQL) Shell & Detaylı Sorgu Komutları</strong>
        <pre style="margin:6px 0 12px 0;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;">-- Temel Shell Operasyonları
show dbs;                                   -- Tüm veritabanlarını listele
use sehirler;                               -- 'sehirler' veritabanına geç
show collections;                           -- Mevcut DB içindeki koleksiyonları (tabloları) listele
db.dropDatabase();                          -- Aktif veritabanını sil
db.city.drop();                             -- 'city' koleksiyonunu tamamen sil

-- Okuma ve Filtreleme Sorguları
db.city.find();                             -- 'city' koleksiyonundaki tüm verileri getir
db.city.find().pretty();                    -- Verileri okunabilir JSON formatında getir
db.city.findOne({ name: "Ankara" });        -- Sadece ilk eşleşen kaydı getir
db.city.find({ pop: { $gt: 15000 } });      -- Nüfusu 15.000'den büyük olanlar ($gt: Greater Than)
db.city.find({ pop: { $gte: 15000 } });     -- Nüfusu 15.000 ve üstü ($gte: Greater Than or Equal)
db.city.find({ pop: { $lt: 50000 } });      -- Nüfusu 50.000'den küçük olanlar ($lt: Less Than)
db.city.find({ state: { $ne: "FL" } });     -- Eyaleti FL olmayanlar ($ne: Not Equal)
db.city.find({ state: { $in: ["FL", "NY"] } }); -- Eyaleti FL veya NY olanlar ($in)

-- Sorgu Örneği ve Mantıksal Operatörler ($and, $or, $nor)
db.city.find({ $and: [ { pop: { $gt: 15000 } }, { state: "FL" } ] });           -- Hem pop > 15000 hem state = 'FL'
db.city.find({ $and: [ { pop: { $gt: 15000 } }, { "state": "FL" } ] }).count(); -- Eşleşen kayıtların sayısını döndürür
db.city.find({ $or: [ { state: "FL" }, { state: "NY" } ] });                    -- Ya FL ya NY olanlar
db.city.find({ $nor: [ { pop: { $gt: 10000 } }, { state: "FL" } ] });           -- Ne pop > 10000 ne de state = FL

-- Sayma (Count), Sıralama (Sort), Atlama (Skip) ve Sınırlama (Limit)
db.city.count();                            -- Koleksiyondaki toplam doküman sayısı
db.city.find({ state: "FL" }).count();      -- Sadece eyaleti FL olanların sayısı
db.city.find().limit(5);                    -- İlk 5 kaydı getir
db.city.find().skip(10).limit(5);           -- İlk 10 kaydı atla, sonraki 5 kaydı getir (Sayfalama)
db.city.find().sort({ pop: 1 });            -- Nüfusa göre küçükten büyüğe sırala (1: ASC)
db.city.find().sort({ pop: -1 });           -- Nüfusa göre büyükten küçüğe sırala (-1: DESC)

-- Veri Ekleme, Güncelleme (Update Operators: $set, $inc, $push, $pop) ve Silme
db.city.insertOne({ name: "Izmir", code: 35, pop: 4000000, tags: ["ege", "sahil"] }); -- Yeni doküman
db.city.updateOne({ name: "Izmir" }, { $set: { pop: 4500000 } });                     -- Popülasyonu güncelle
db.city.updateOne({ name: "Izmir" }, { $inc: { pop: 1000 } });                        -- Popülasyonu 1000 artır ($inc)
db.city.updateOne({ name: "Izmir" }, { $push: { tags: "liman" } });                   -- Diziye eleman ekle ($push)
db.city.updateOne({ name: "Izmir" }, { $pop: { tags: 1 } });                          -- Dizinin son elemanını çıkar (1: son, -1: ilk)
db.city.deleteOne({ name: "Izmir" });                                                 -- Tek doküman sil
db.city.deleteMany({ pop: { $lt: 1000 } });                                           -- Nüfusu 1000'den küçük tüm şehirleri sil</pre>

        <strong style="color:var(--accent);font-size:13px;">2. MySQL / MariaDB CLI & Detaylı SQL Sorgu Komutları</strong>
        <pre style="margin:6px 0 12px 0;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;">-- Shell & Veritabanı Yönergeleri
SHOW DATABASES;                             -- Tüm veritabanlarını listele
USE sehirler;                               -- 'sehirler' veritabanını seç
SHOW TABLES;                                -- Veritabanındaki tabloları listele
DESCRIBE city;                              -- 'city' tablosunun sütun/şema yapısını göster

-- Filtreleme, Mantıksal Operatörler ve Sayma Fonksiyonları
SELECT * FROM city;                         -- Tablodaki tüm verileri çek
SELECT COUNT(*) FROM city;                  -- Toplam satır sayısını getir
SELECT COUNT(*) FROM city WHERE pop > 15000 AND state = 'FL'; -- Mantıksal AND ve COUNT
SELECT * FROM city WHERE state = 'FL' OR state = 'NY';        -- Mantıksal OR
SELECT * FROM city WHERE pop BETWEEN 10000 AND 50000;         -- Aralık sorgusu
SELECT * FROM city ORDER BY pop DESC LIMIT 5;                 -- En yüksek nüfuslu 5 şehri getir

-- DML & Veri Manipülasyonu
INSERT INTO city (name, plaka, pop) VALUES ('Ankara', 6, 5800000); -- Yeni satır ekle
UPDATE city SET pop = pop + 1000 WHERE plaka = 6;                  -- Değer artırma
DELETE FROM city WHERE id = 1;              -- Veriyi sil
DROP TABLE city;                            -- Tabloyu sil
SELECT user, host FROM mysql.user;          -- DB kullanıcılarını listele
SELECT @@version, database(), user();       -- Versiyon, aktif DB ve mevcut kullanıcıyı göster</pre>

        <strong style="color:var(--secondary);font-size:13px;">3. PostgreSQL CLI (\d Komutları & SQL)</strong>
        <pre style="margin:6px 0 12px 0;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;">\l                                          -- Tüm veritabanlarını listele (List DBs)
\c sehirler                                 -- 'sehirler' veritabanına bağlan (Connect)
\dt                                         -- Aktif DB'deki tabloları listele (Display Tables)
\d city                                     -- 'city' tablosunun şemasını detaylı göster
\du                                         -- Kullanıcıları ve yetkilerini listele
SELECT count(*) FROM city WHERE pop > 15000 AND state = 'FL'; -- Filtreleme ve Sayım
SELECT * FROM city ORDER BY pop DESC LIMIT 10 OFFSET 5;       -- Sıralama, Limit ve Offset
SELECT version();                           -- PostgreSQL versiyonunu göster</pre>

        <strong style="color:var(--secondary);font-size:13px;">4. Redis CLI Komutları (String, List, Hash Operasyonları)</strong>
        <pre style="margin:6px 0 12px 0;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;">-- Key-Value Operasyonları
KEYS *                                      -- Tüm anahtarları (keys) listele
GET sehir:06                                -- 'sehir:06' anahtarının değerini oku
SET sehir:06 "Ankara"                       -- Key-Value çifti oluştur/güncelle
EXPIRE sehir:06 3600                        -- Key için 3600 saniye TTL koy
TTL sehir:06                                -- Kalan yaşam süresini sorgula
DEL sehir:06                                -- Key'i sil

-- Liste ve Dizilim Operasyonları (Push, Pop, Len)
LPUSH sehirler "Ankara"                     -- Listenin başına eleman ekle
RPUSH sehirler "Istanbul"                   -- Listenin sonuna eleman ekle
LPOP sehirler                               -- Listenin ilk elemanını çıkar/döndür ($pop karşılığı)
RPOP sehirler                               -- Listenin son elemanını çıkar/döndür
LLEN sehirler                               -- Listenin eleman sayısını ver (Count karşılığı)
LRANGE sehirler 0 -1                        -- Tüm liste elemanlarını getir

-- Sunucu ve Konfigürasyon
INFO                                        -- Redis sunucu bilgilerini getir
FLUSHALL                                    -- Tüm veritabanlarındaki verileri temizle</pre>

        <strong style="color:#4ade80;font-size:13px;">5. Elasticsearch REST API Komutları</strong>
        <pre style="margin:6px 0 12px 0;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;">GET /_cat/indices?v                         -- Tüm indeksleri (DB/Tablo) listele
GET /sehirler/_count                        -- 'sehirler' indeksindeki toplam kayıt sayısını al
GET /sehirler/_search?q=state:FL            -- Eyaleti FL olanları getir
GET /sehirler/_search?q=pop:>15000          -- Popülasyonu 15000'den büyük olanları getir
GET /sehirler/_doc/1                        -- ID'si 1 olan dokümanı getir
GET /sehirler/_mapping                      -- Indeks şema yapısını getir</pre>

        <strong style="color:#4ade80;font-size:13px;">6. Cassandra (CQL) Komutları</strong>
        <pre style="margin:6px 0 0 0;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;">DESCRIBE KEYSPACES;                         -- Keyspace'leri (DB) listele
USE sehirler;                               -- Keyspace seç
DESCRIBE TABLES;                            -- Tabloları listele
SELECT COUNT(*) FROM city;                  -- Kayıt sayısını getir
SELECT * FROM city WHERE state = 'FL';      -- Tablo verisini oku</pre>
      `
    }
  ]
},

        sections: [
          {
            title: '1. Web Servisi Nedir? (Temel Kavramlar & Nitelikler)',
            content: `
              <p style="color:var(--muted);font-size:14px;margin-bottom:12px;">
                Web servisleri; farklı platformlarda (Windows, Linux), farklı dillerle (Python, Java, PHP, C#) yazılmış veya farklı sunucularda çalışan uygulamaların internet üzerinden veri alışverişi yapmasını ve konuşmasını sağlayan standartlaştırılmış yazılım bileşenleridir.
              </p>
              <div class="tool-io-grid">
                <div class="card" style="margin-bottom:0; border: 1px solid rgba(139,92,246,0.3);">
                  <h4 style="font-size:13px; color:var(--accent);">Uygulamalar Arası Entegrasyon</h4>
                  <p class="small" style="margin:0;">A uygulaması, B uygulamasında geliştirilmiş bir fonksiyonu veya veriyi doğrudan tüketir (Örn: E-ticaret sitesinin PayPal/iyzico ödeme servisini çağırması).</p>
                </div>
                <div class="card" style="margin-bottom:0; border: 1px solid rgba(6,182,212,0.3);">
                  <h4 style="font-size:13px; color:var(--secondary);">Uygulama İçi Katman Ayrımı</h4>
                  <p class="small" style="margin:0;">Modern web/mobil ön yüzleri (Frontend), içeriği dinamik güncellemek için arka plandaki web servisi fonksiyonlarını tetikler (Headless mimari).</p>
                </div>
              </div>

              <div style="margin-top:12px; display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;">
                <div style="background:rgba(255,255,255,0.02); padding:10px; border-radius:8px; border-left:3px solid var(--accent);">
                  <strong style="color:#cbd5e1; font-size:13px;">Interoperability (Birlikte Çalışabilirlik)</strong>
                  <p class="small" style="margin:4px 0 0 0;">HTTP, XML, JSON, SOAP ve REST gibi açık standartlara dayanarak sistemler arası uyumluluğu garanti eder.</p>

                  <strong style="color:#cbd5e1; font-size:13px;">Platform-Agnostic (Platform Bağımsız)</strong>
                  <p class="small" style="margin:4px 0 0 0;">İşletim sistemi veya programlama dilinden bağımsızdır; Java servisi ile Python scripti sorunsuz konuşur.</p>

                <div style="background:rgba(255,255,255,0.02); padding:10px; border-radius:8px; border-left:3px solid #4ade80;">
                  <strong style="color:#cbd5e1; font-size:13px;">Loose Coupling (Gevşek Bağlantı)</strong>
                  <p class="small" style="margin:4px 0 0 0;">Bir sistemin iç mantığındaki değişiklikler, web servisi arayüzü bozulmadığı sürece diğer sistemleri aksatmaz.</p>
                </div>
                <div style="background:rgba(255,255,255,0.02); padding:10px; border-radius:8px; border-left:3px solid #facc15;">
                  <strong style="color:#cbd5e1; font-size:13px;">Location Independence (Konum Bağımsızlığı)</strong>
                  <p class="small" style="margin:4px 0 0 0;">Servis internete bağlı herhangi bir sunucuda barındırılabilir; istemci sadece uç noktayı (endpoint) bilir.</p>

              </div>

          {
            title: '2. Web Servisi vs Web Uygulaması',
            content: `

                <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
                  <thead>
                    <tr style="border-bottom:1px solid var(--glass);">
                      <th style="text-align:left;padding:8px;color:#cbd5e1;">Kriter</th>
                      <th style="text-align:left;padding:8px;color:var(--accent);">Web Servisleri (Web Services)</th>
                      <th style="text-align:left;padding:8px;color:var(--secondary);">Web Uygulamaları (Web Applications)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Temel Amaç</b></td>

                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Kullanıcı Etkileşimi</b></td>

                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Protokoller</b></td>
                      <td style="padding:8px;">SOAP, REST, XML-RPC, JSON-RPC.</td>

                      <td style="padding:8px;color:#cbd5e1;"><b>Güvenlik Odağı</b></td>

                      <td style="padding:8px;">Kapsamlı web güvenliği: XSS, CSRF, Session Hijacking, Clickjacking, Input Validation.</td>
                    </tr>
                    <tr>
                      <td style="padding:8px;color:#cbd5e1;"><b>Örnekler</b></td>
                      <td style="padding:8px;">Ödeme ağ geçitleri (PayPal API), Meteoroloji veri servisleri.</td>
                      <td style="padding:8px;">İnternet bankacılığı, Amazon, Gmail, Twitter/X.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            `

          {
            title: '3. Web Servisi vs API (Kavramsal Fark)',
            content: `
              <p style="color:var(--muted);font-size:14px;margin-bottom:12px;">
                Her web servisi bir API'dir, ancak her API bir web servisi değildir. API daha kapsayıcı bir çatı tanımdır; web servisi ise bunun ağ/web üzerinden yürüyen özel bir alt kümesidir.
              </p>
              <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
                  <thead>
                    <tr style="border-bottom:1px solid var(--glass);">
                      <th style="text-align:left;padding:8px;color:#cbd5e1;">Özellik</th>
                      <th style="text-align:left;padding:8px;color:var(--accent);">Web Servisi</th>
                      <th style="text-align:left;padding:8px;color:var(--secondary);">API (Application Programming Interface)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Kapsam</b></td>
                      <td style="padding:8px;">API'lerin internet/ağ üzerinden çalışan alt kümesidir.</td>
                      <td style="padding:8px;">Yazılım etkileşimlerini kapsayan genel şemsiye (OS API, DLL, Library API dahil).</td>

                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>İletişim</b></td>

                      <td style="padding:8px;">Ağ zorunlu değildir; yerel kod kütüphaneleri de API sunar (ör: POSIX API).</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;color:#cbd5e1;"><b>Standartlar</b></td>
                      <td style="padding:8px;">WSDL, WS-Security, WS-Policy (özellikle SOAP tabanlılarda katı kurallar).</td>
                      <td style="padding:8px;">OpenAPI (Swagger), GraphQL, RAML veya özel tanımlı protokoller.</td>
                    </tr>
                    <tr>
                      <td style="padding:8px;color:#cbd5e1;"><b>Veri Biçimi</b></td>
                      <td style="padding:8px;">Ağırlıklı olarak XML ve JSON.</td>
                      <td style="padding:8px;">Her türlü format (JSON, XML, binary veri, ham bellek yapıları).</td>
                    </tr>
                  </tbody>
                </table>

          {

            content: `
              <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;font-size:14px">
                  <strong style="color:#cbd5e1;">1. XML-RPC (1998):</strong>
                  <p class="small" style="margin:4px 0 6px 0;">SOAP ve REST'in atasıdır. Uzaktaki bir fonksiyonu HTTP POST altında XML kullanarak çağırmayı sağlar.</p>
                  <div class="tool-io-grid">
                    <div>
                      <span style="font-size:11px;color:var(--accent);">İstek (Request):</span>
                      <pre style="margin:4px 0 0 0;padding:8px;background:rgba(0,0,0,0.3);font-size:11px;color:#00ff88;">POST /RPC2 HTTP/1.1
Host: api.target.com
Content-Type: text/xml

&lt;methodCall&gt;
  &lt;methodName&gt;sampleMethod&lt;/methodName&gt;
  &lt;params&gt;
    &lt;param&gt;&lt;value&gt;&lt;int&gt;42&lt;/int&gt;&lt;/value&gt;&lt;/param&gt;

&lt;/methodCall&gt;</pre>

Content-Type: text/xml

&lt;methodResponse&gt;
  &lt;params&gt;
    &lt;param&gt;&lt;value&gt;&lt;string&gt;Hello, World!&lt;/string&gt;&lt;/value&gt;&lt;/param&gt;
  &lt;/params&gt;
&lt;/methodResponse&gt;</pre>
                    </div>
                  </div>
                  <div class="small" style="margin-top:6px;color:#ef4444;"><b>Pentest Notu:</b> WordPress'teki <code>xmlrpc.php</code> gibi uç noktalar brute-force ve amplifikasyon (DDoS) saldırılarında sıkça istismar edilir.</div>
                </li>

POST /rpc HTTP/1.1
Content-Type: application/json

{"jsonrpc": "2.0", "method": "subtract", "params": [42, 23], "id": 1}

// Yanıt (Response)
{"jsonrpc": "2.0", "result": 19, "id": 1}</pre>
                </li>

                <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;font-size:14px">
                  <strong style="color:#cbd5e1;">3. SOAP (Simple Object Access Protocol):</strong>
                  <p class="small" style="margin:4px 0 6px 0;">XML-RPC'nin gelişmiş halidir. Katı veri tiplerine (strong typing), işlem desteğine (ACID), kurumsal güvenliğe (WS-Security) sahiptir. Arayüz tanımı için WSDL kullanır.</p>
                  <pre style="margin:0;padding:8px;background:rgba(0,0,0,0.3);font-size:11px;color:#00ff88;">&lt;soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"&gt;
  &lt;soapenv:Body&gt;
    &lt;m:GetPrice xmlns:m="https://target.com/prices"&gt;

  &lt;/soapenv:Body&gt;

                  </div>
                </li>

            `

          {
            title: '5. WSDL (Web Services Description Language) Temelleri',
            content: `
              <p style="color:var(--muted);font-size:14px;margin-bottom:12px;">
                WSDL; özellikle SOAP tabanlı servislerin hangi operasyonları sunduğunu, hangi parametreleri beklediğini ve istemcinin servisle nasıl el sıkışacağını tanımlayan XML tabanlı resmi bir sözleşmedir (contract).
              </p>

              <div class="tool-io-grid">
                <div class="card" style="margin-bottom:0; border-left: 2px solid var(--accent);">
                  <strong style="color:var(--accent); font-size:13px;">Abstract (Soyut) Tanım</strong>
                  <p class="small" style="margin:4px 0 0 0;">Servisin <b>ne yaptığını</b> belirtir: Metot adları (operations), beklenen girdi (input), dönen çıktı (output) ve hata mesajları (faults).</p>
                </div>
                <div class="card" style="margin-bottom:0; border-left: 2px solid var(--secondary);">
                  <strong style="color:var(--secondary); font-size:13px;">Concrete (Somut) Tanım</strong>
                  <p class="small" style="margin:4px 0 0 0;">Servisin <b>nasıl ve nerede</b> çalıştığını açıklar: Ağ protokolü bağlamı (SOAP over HTTP), encoding kuralları ve fiziksel endpoint URL adresi.</p>
                </div>
              </div>

              <h4 style="font-size:14px; color:#cbd5e1; margin:16px 0 8px 0;">WSDL 1.1 Temel Elementleri</h4>
              <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
                  <thead>
                    <tr style="border-bottom:1px solid var(--glass);">
                      <th style="text-align:left;padding:8px;color:#cbd5e1;">Element</th>
                      <th style="text-align:left;padding:8px;color:var(--accent);">Görevi</th>
                      <th style="text-align:left;padding:8px;color:var(--secondary);">Detay</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;"><code>&lt;types&gt;</code></td>
                      <td style="padding:8px;">Veri tipleri ve şemalar</td>
                      <td style="padding:8px;">XML Schema Definition (XSD) ile değişken tiplerini tanımlar.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;"><code>&lt;message&gt;</code></td>
                      <td style="padding:8px;">İletişim mesaj yapıları</td>
                      <td style="padding:8px;">Metotların parametrelerini taşır; <code>&lt;types&gt;</code> alanına referans verir.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;"><code>&lt;portType&gt;</code></td>
                      <td style="padding:8px;">Desteklenen operasyonlar</td>
                      <td style="padding:8px;">İstemcinin çağırabileceği fonksiyonları (operasyonları) ve mesaj yönünü belirtir.</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                      <td style="padding:8px;"><code>&lt;binding&gt;</code></td>
                      <td style="padding:8px;">Protokol bağlama</td>
                      <td style="padding:8px;">Operasyonların SOAP over HTTP veya başka protokolle nasıl taşınacağını belirler.</td>
                    </tr>
                    <tr>
                      <td style="padding:8px;"><code>&lt;service&gt;</code></td>
                      <td style="padding:8px;">Uç nokta (Endpoint) URL</td>
                      <td style="padding:8px;">Servise doğrudan erişilecek fiziksel URL adresini içerir.</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="card" style="margin-top:14px; border-left: 2px solid #facc15; background:rgba(250, 204, 21, 0.05);">
                <strong style="color:#facc15; font-size:13px;">WSDL 1.1 vs WSDL 2.0 Farkı:</strong>
                <p class="small" style="margin:4px 0 0 0;">
                  WSDL 2.0 sürümünde <code>&lt;portType&gt;</code> kaldırılmış ve yerine doğrudan <code>&lt;interface&gt;</code> getirilmiştir. <code>&lt;interface&gt;</code> artık bağımsız <code>&lt;message&gt;</code> etiketlerine değil, doğrudan <code>&lt;types&gt;</code> bloğu içindeki XSD şemalarına işaret eder.
                </p>
              </div>

              <div class="card" style="margin-top:10px; border-left: 2px solid #ef4444; background:rgba(239,68,68,0.05);">
                <strong style="color:#ef4444; font-size:13px;">⚠️ Pentest & Bug Bounty Açısından WSDL:</strong>
                <p class="small" style="margin:4px 0 0 0;">
                  Hedef sistemde <code>?wsdl</code> veya <code>.wsdl</code> dosyası ifşa edilmişse (Information Disclosure), sistemin gizli tuttuğu tüm backend API metotları, parametre adları ve veri tipleri tek seferde çıkarılabilir. Bu dosya doğrudan Burp Suite'e ("Wsdler" eklentisi) veya SoapUI'a yüklenerek dakikalar içinde zafiyetli parametreler (SQLi, XXE, Command Injection) test edilebilir.
                </p>
              </div>
            `
          }

                  <span style="color:#facc15; font-size:11px;">⚠️ Servisler arası örtük güven vardır. Dışarıdan tetiklenen bir SSRF ile iç mikroservisler korunmasız yakalanır.</span>

        "sections": [
          {
            "title": "Reflected XSS",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Tarayıcıda JavaScript kodu çalıştırılarak ortaya çıkan zafiyet türüdür. Girdi alanlarında ve URL parametrelerinde denenebilir.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><code>example.com/search?q=test'</code> &rarr; Sayfa kaynağını görüntüle (CTRL+U) &rarr; 'test' kelimesini arat. Payload sunucu tarafından encode ediliyor mu kontrol et.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Eğer girdi encode edilmiyorsa, <code>\"/></code> gibi karakterlerle mevcut HTML etiketini kapatıp kendi script kodumuzu enjekte edebiliriz.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Örnek Payload: <code>&lt;img src=x onerror=alert('XSS')&gt;</code></li>\n\t\t\t</ul>"

          {
            "title": "Stored XSS",

          },
          {
            "title": "DOM XSS",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Tarayıcı tarafında, JavaScript ile kullanıcıdan gelen verinin (URL hash, search, localStorage vb.) DOM'a güvenli olmayan bir şekilde yazdırılmasıyla oluşur.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>Riskli Kaynaklar (source):</b><div style='display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;'><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>location.search</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>location.hash</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>location.pathname</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>location.href</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>document.URL</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>document.referer</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>window.name</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>window.postMessage</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>WebSocket</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>EventSource</code></div></li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>Riskli Fonksiyonlar (sink):</b><div style='display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;'><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>innerHTML</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>document.write</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>eval()</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>insertAdjacentHTML</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>setTimeout()</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>setInterval()</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>new Function()</code><code style='background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:14px;'>element.href</code></div></li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>Hızlı test:</b> URL'deki hash (#) veya query (?) parametresini değiştirin. Eğer bu değer sayfada bir yere yazılıyorsa, kaynak kodunu inceleyerek hangi fonksiyonun kullanıldığını kontrol edin.<br><code>textContent</code> ve <code>innerText</code> güvenli iken <code>innerHTML</code> tehlikelidir.</li>\n\t\t\t</ul>"
