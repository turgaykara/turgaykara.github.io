      const paramlistInput = document.getElementById('paramlistInput');
      const resultsOutput = document.getElementById('paramResultOutput');

      findButton.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        const wordlist = paramlistInput.value;
        if (!url || !wordlist) {
          resultsOutput.textContent = 'Lütfen URL ve parametre listesi girin.';
          return;
        }

        resultsOutput.textContent = `Parametreler taranıyor, bu işlem uzun sürebilir...`;
        findButton.disabled = true;
        findButton.textContent = 'Aranıyor...';

        try {
          const response = await fetch('https://admin3131.pythonanywhere.com/paramfinder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, wordlist: wordlist }),
          });
          const data = await response.json();
          if (data.error) throw new Error(data.error);

          if (data.found && data.found.length > 0) {
            let formattedResults = `Baz Yanıt: Durum Kodu ${data.base_status}, Uzunluk ${data.base_length}\n\n`;
            formattedResults += "Farklı Yanıt Veren Potansiyel Parametreler:\n\n";
            data.found.forEach(item => {
              formattedResults += `[PARAMETRE: ${item.param}] - Durum: ${item.status}, Uzunluk: ${item.length}\n   URL: ${item.url}\n\n`;
            });
            resultsOutput.textContent = formattedResults;
          } else {
            resultsOutput.textContent = "Hiçbir potansiyel parametre bulunamadı.";
          }
        } catch (error) {
          resultsOutput.textContent = `Hata: ${error.message}`;
        } finally {
          findButton.disabled = false;
          findButton.textContent = 'Parametreleri Keşfet';
        }
      });
    }
    function activateEncoderDecoder() {
      const tabButtons = document.querySelectorAll('.tab-button');
      const tabContents = document.querySelectorAll('.tab-content');

      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          tabButtons.forEach(btn => btn.classList.remove('active'));
          tabContents.forEach(content => content.classList.remove('active'));
          button.classList.add('active');
          document.getElementById(button.dataset.tab).classList.add('active');
        });
      });

      const identifierInput = document.getElementById('identifierInput');
      const identifierOutput = document.getElementById('identifierOutput');
      if (identifierInput) {
        identifierInput.addEventListener('input', () => {
          const value = identifierInput.value.trim();
          identifierOutput.classList.remove('found');

          if (value === '') {
            identifierOutput.textContent = 'Olası formatlar burada görünecek...';
            return;
          }

          let results = [];
          if (/^[a-f0-9]{32}$/i.test(value)) results.push('MD5 Hash');
          if (/^[a-f0-9]{40}$/i.test(value)) results.push('SHA1 Hash');
          if (/^[a-f0-9]{64}$/i.test(value)) results.push('SHA256 Hash');
          if (/^[a-f0-9]{128}$/i.test(value)) results.push('SHA512 Hash');
          if (/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value) && value.length % 4 === 0) {
            results.push('Base64');
          }
          if (/^([0-9a-fA-F]{2})+$/.test(value)) results.push('Hex');
          if (/%[0-9a-fA-F]{2}/.test(value)) results.push('URL Encoded');
          if (/&#?[a-zA-Z0-9]+;/.test(value)) results.push('HTML Entity');
          if (value.split('.').length === 3 && value.includes('ey')) results.push('JWT (Olası)');

          if (results.length > 0) {
            identifierOutput.innerHTML = `Olası Format(lar): <strong>${results.join(', ')}</strong>`;
            identifierOutput.classList.add('found');
          } else {
            identifierOutput.textContent = 'Format tespit edilemedi.';
          }
        });
      }

      const stringToHex = str => str.split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
      const hexToString = hex => {
        let str = '';
        for (let i = 0; i < hex.length; i += 2) str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
        return str;
      };
      const encodeHtmlEntities = str => {
        const temp = document.createElement('div');
        temp.textContent = str;
        return temp.innerHTML;
      };
      const decodeHtmlEntities = str => {
        const temp = document.createElement('textarea');
        temp.innerHTML = str;
        return temp.value;
      };

      const setupListener = (id, action) => {
        const button = document.getElementById(id);
        if (button) button.addEventListener('click', action);
      };
      const encodeInput = document.getElementById('encodeInput');
      const encodeOutput = document.getElementById('encodeOutput');
      const decodeInput = document.getElementById('decodeInput');
      const decodeOutput = document.getElementById('decodeOutput');

      setupListener('btnB64Encode', () => { encodeOutput.value = btoa(encodeInput.value); });
      setupListener('btnUrlEncode', () => { encodeOutput.value = encodeURIComponent(encodeInput.value); });
      setupListener('btnHexEncode', () => { encodeOutput.value = stringToHex(encodeInput.value); });
      setupListener('btnHtmlEncode', () => { encodeOutput.value = encodeHtmlEntities(encodeInput.value); });
      setupListener('btnMd5', () => { encodeOutput.value = CryptoJS.MD5(encodeInput.value).toString(); });
      setupListener('btnSha1', () => { encodeOutput.value = CryptoJS.SHA1(encodeInput.value).toString(); });
      setupListener('btnSha256', () => { encodeOutput.value = CryptoJS.SHA256(encodeInput.value).toString(); });
      setupListener('btnCopyEncodeOutput', () => {
        navigator.clipboard.writeText(encodeOutput.value);
        document.getElementById('btnCopyEncodeOutput').textContent = 'Kopyalandı!';
        setTimeout(() => { document.getElementById('btnCopyEncodeOutput').textContent = 'Çıktıyı Kopyala'; }, 1500);
      });

      setupListener('btnB64Decode', () => { try { decodeOutput.value = atob(decodeInput.value); } catch (e) { decodeOutput.value = 'Hata: Geçersiz Base64 dizesi.'; } });
      setupListener('btnUrlDecode', () => { try { decodeOutput.value = decodeURIComponent(decodeInput.value); } catch (e) { decodeOutput.value = 'Hata: Geçersiz URL formatı.'; } });
      setupListener('btnHexDecode', () => { try { decodeOutput.value = hexToString(decodeInput.value); } catch (e) { decodeOutput.value = 'Hata: Geçersiz Hex dizesi.'; } });
      setupListener('btnHtmlDecode', () => { decodeOutput.value = decodeHtmlEntities(decodeInput.value); });
      setupListener('btnCopyDecodeOutput', () => {
        navigator.clipboard.writeText(decodeOutput.value);
        document.getElementById('btnCopyDecodeOutput').textContent = 'Kopyalandı!';
        setTimeout(() => { document.getElementById('btnCopyDecodeOutput').textContent = 'Çıktıyı Kopyala'; }, 1500);
      });
    }
    function setupForum() {
      const authSection = document.getElementById('auth-section');
      const userSessionSection = document.getElementById('user-session-section');
      const userUsernameEl = document.getElementById('user-username');
      const newPostForm = document.getElementById('new-post-form');
      const postsSection = document.getElementById('posts-section');

      const loginBtn = document.getElementById('login-email-btn');
      const registerBtn = document.getElementById('register-email-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const sendPostBtn = document.getElementById('send-post-btn');
      const emailForm = document.getElementById('email-login-form');

      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');

      const updateUI = (isLoggedIn, userUsername = '') => {
        if (isLoggedIn) {
          if (authSection) authSection.classList.add('hidden');
          if (userSessionSection) userSessionSection.classList.remove('hidden');
          if (newPostForm) newPostForm.classList.remove('hidden');
          if (userUsernameEl) userUsernameEl.textContent = userUsername;
        } else {
          if (authSection) authSection.classList.remove('hidden');
          if (userSessionSection) userSessionSection.classList.add('hidden');
          if (newPostForm) newPostForm.classList.add('hidden');
        }
      };

      const escapeHTML = (str) => {
        const p = document.createElement("p");
        p.textContent = str;
        return p.innerHTML;
      };

      const fetchPosts = async () => {
        if (!postsSection) return;
        postsSection.innerHTML = '<p class="small">Mesajlar yükleniyor...</p>';
        try {
          const response = await fetch(`${API_BASE_URL}/posts`);
          const posts = await response.json();
          if (posts && posts.length > 0) {
            postsSection.innerHTML = posts.map(post => `
                    <div class="card">
                        <p style="white-space: pre-wrap; word-break: break-word;">${escapeHTML(post.content)}</p>
                        <p class="small"><strong>Yazan:</strong> ${escapeHTML(post.author_email) || 'anonim'}<br><strong>Tarih:</strong> ${new Date(post.created_at).toLocaleString()}</p>
                    </div>
                `).join('');
          } else {
            postsSection.innerHTML = '<p class="small">Henüz hiç mesaj yazılmamış.</p>';
          }
        } catch (error) {
          postsSection.innerHTML = '<p class="small" style="color:red;">Mesajlar yüklenemedi. Backend sunucusunun çalıştığından emin olun.</p>';
        }
      };

      const checkSession = async () => {
        try {
          const response = await fetch(`${API_BASE_URL}/session`, { credentials: 'include' });
          const data = await response.json();
          updateUI(data.is_logged_in, data.user?.username);
        } catch (error) {
          console.error("Oturum kontrol edilemedi:", error);
          updateUI(false);
        }
      };

      if (emailForm) {
        emailForm.addEventListener('submit', e => e.preventDefault());
      }
      if (loginBtn) {
        loginBtn.addEventListener('click', async () => {
          const email = emailInput.value;
          const password = passwordInput.value;
          const response = await fetch(`${API_BASE_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
            credentials: 'include'
          });
          const data = await response.json();
          if (response.ok) {
            checkSession();
          } else {
            alert(data.error);
          }
        });
      }

      if (registerBtn) {
        registerBtn.addEventListener('click', async () => {
          const email = document.getElementById('email-input').value;
          const password = document.getElementById('password-input').value;

          const response = await fetch(`${API_BASE_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          alert(data.message || data.error);

          if (response.ok) {
            document.getElementById('email-input').value = '';
            document.getElementById('password-input').value = '';
          }
        });
      }
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          await fetch(`${API_BASE_URL}/logout`, { method: 'POST', credentials: 'include' });
          checkSession();
        });
      }
      if (sendPostBtn) {
        sendPostBtn.addEventListener('click', async () => {
          const content = document.getElementById('post-content').value;
          if (!content.trim()) return;
          const response = await fetch(`${API_BASE_URL}/posts`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
            credentials: 'include'
          });
          if (response.ok) {
            document.getElementById('post-content').value = '';
            fetchPosts();
          } else {
            const data = await response.json();
            alert(data.error || 'Mesaj gönderilemedi.');
          }
        });
      }

      checkSession();
      fetchPosts();
    }
